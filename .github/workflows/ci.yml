# CI Corde — Linux + Windows.
#
# web        : types TS générés depuis le protocole Rust, typecheck, tests, build du dashboard (artefact ui-dist)
# rust       : fmt, clippy (toléré), tests, build release des binaires (corde-server, lmu-probe, corde-sim, corde-store),
#              artefacts corde-linux / corde-windows (binaires + ui/ + docs/TESTING-ON-PC.md)
# server-linux : Corde serveur (rôle hub, Raspberry Pi) : corde-server pour Linux arm64 et x64 (zig, glibc
#              2.28), essayé (x64 directement, arm64 sous qemu), archives corde-server-<version>-linux-<arch>.tar.gz
#              (binaire, ui/, service systemd, install.sh, uninstall.sh, docs) → artefact corde-server-linux
# desktop    : application de bureau (coquille Tauri 2, apps/desktop — workspace Cargo à part) sur windows-latest :
#              installeur NSIS, artefact corde-setup (Corde_<version>_x64-setup.exe, et sa signature de mise à
#              jour Corde_<version>_x64-setup.exe.sig quand le secret TAURI_SIGNING_PRIVATE_KEY existe). C'est le
#              seul endroit où la coquille est compilée.
# continuous : sur push main seulement, pré-release glissante étiquetée `continuous` (« Corde — dernière version ») :
#              installeur + zip portable + archives de Corde serveur, anciens fichiers remplacés
# version    : sur push main seulement, release NUMÉROTÉE v<version> (version de tauri.conf.json) si elle n'existe
#              pas encore et que la signature de mise à jour a été produite : installeur, .sig, zip portable et
#              latest.json (lu par le bouton « Rechercher une mise à jour » de l'application)
# release    : sur tag v* poussé à la main, zip Windows + tar.gz Linux + installeur attachés à une GitHub Release
#              d'archive (jamais « latest », sautée si la release du tag existe déjà)
# deny       : licences, avis de sécurité et sources des dépendances Rust (cargo-deny, deny.toml) —
#              informatif : n'empêche ni les autres jobs ni la publication
#
# Articulation des trois publications (aucun doublon) :
#   - `continuous` : la pré-release glissante, recréée à chaque poussée sur main, pour essayer le dernier état.
#     Une pré-release n'est jamais « latest » : elle n'est pas vue par les mises à jour de l'application.
#   - `version` : la voie normale des versions. Changer le numéro (tauri.conf.json, Cargo.toml, package.json,
#     section du CHANGELOG.md) et pousser sur main suffit : la release v<version> est créée une fois, marquée
#     « latest », et son latest.json est servi à
#     https://github.com/dultra123/corde/releases/latest/download/latest.json (adresse fixée dans l'application).
#     Les poussées suivantes avec le même numéro ne recréent rien. L'étiquette v<version> est créée par l'API
#     avec le jeton du workflow : GitHub ne relance donc PAS ce workflow pour elle (pas de job `release` en double).
#   - `release` : seulement pour une étiquette v* poussée à la main (version spéciale, archive Linux). Si la
#     release existe déjà (créée par `version`), le job ne fait rien. Sinon il crée une release d'archive qui
#     n'est jamais « latest » : elle ne peut pas détourner les mises à jour vers une release sans latest.json.
#     Ne pas pousser à la main l'étiquette d'une version que `version` doit publier (elle serait sautée).
#
# Sécurité (dépôt public) : jeton en lecture seule par défaut, `contents: write` seulement dans
# `continuous`, `version` et `release`, qui ne tournent que sur une poussée du dépôt d'origine (jamais
# sur une PR ni sur un fork) ; pas de `pull_request_target` ; secrets de signature (code Windows et
# mises à jour) jamais exposés au code d'une PR ni d'un fork ; aucune valeur contrôlable par un tiers
# (titre de PR, nom de branche ou d'étiquette) n'est collée dans un script `run:`, elle passe par une
# variable d'environnement.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Une poussée qui ne touche que la documentation ne reconstruit rien (les minutes Windows
    # comptent double sur un dépôt privé). `knowledge/` n'est PAS ignoré : ses YAML sont
    # compilés dans corde-engineer.
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  # L'événement fait partie du groupe : pour une PR déjà fusionnée, github.ref vaut la branche de
  # base (refs/heads/main), et son run « pull_request » annulait le run « push » de main — donc la
  # publication de la version continue.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  web:
    name: Web (protocole TS + dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Les types de @corde/protocol sont générés par ts-rs et ignorés par git :
      # il faut Rust ici aussi.
      # Action épinglée sur un commit (branche `stable` de dtolnay/rust-toolchain, qui ne publie
      # pas de versions) : `toolchain` devient alors obligatoire.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web

      - name: Générer les types TypeScript (ts-rs)
        run: cargo test -p corde-protocol

      # Version de pnpm lue dans le champ `packageManager` de package.json (pnpm@10.x) :
      # ne pas ajouter `version:` ici, l'action refuse les deux à la fois.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: packages/ui/dist
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: windows-latest
            name: windows
            ext: ".exe"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ matrix.name }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (toléré pour l'instant)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      - name: Build release (corde-server, lmu-probe, corde-sim, corde-store)
        run: cargo build --release -p corde-server -p corde-lmu -p corde-sim -p corde-store --bins

      - name: Récupérer le dashboard construit
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist

      - name: Assembler l'archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/ui dist/docs
          for bin in corde-server lmu-probe corde-sim corde-store; do
            cp "target/release/${bin}${{ matrix.ext }}" dist/
          done
          cp -r ui-dist/. dist/ui/
          cp docs/TESTING-ON-PC.md dist/docs/
          cp README.md dist/
          ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: corde-${{ matrix.name }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  server-linux:
    name: Corde serveur (archives Linux arm64 et x64)
    needs: web
    runs-on: ubuntu-latest
    env:
      # Versions épinglées des outils d'édition de liens croisée (zig fournit une glibc ancienne :
      # le binaire tourne sur Raspberry Pi OS « Bookworm », glibc 2.36, et plus ancien).
      ZIGLANG_VERSION: "0.17.1"
      CARGO_ZIGBUILD_VERSION: "0.24.1"
      GLIBC_TARGET: "2.28"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server-linux

      - name: Outils (zig, cargo-zigbuild, qemu pour essayer le binaire arm64)
        run: |
          set -euo pipefail
          python3 -m pip install --user "ziglang==${ZIGLANG_VERSION}" "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static libc6-arm64-cross shellcheck

      - name: Vérifier les scripts d'installation (shellcheck)
        run: shellcheck -x packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/make-archive.sh

      - name: Construire corde-server (Linux x64 et arm64, glibc ${{ env.GLIBC_TARGET }})
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cargo zigbuild --release --locked -p corde-server --bin corde-server --target "${target}.${GLIBC_TARGET}"
          done

      - name: Contrôler les binaires (version de glibc, démarrage, mode serveur)
        run: |
          set -euo pipefail
          for pair in x64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}
            bin="target/${pair#*:}/release/corde-server"
            file "$bin"
            max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "${arch} : glibc ${max} au plus"
            if [ "$(printf '%s\n%s\n' "$max" "$GLIBC_TARGET" | sort -V | tail -1)" != "$GLIBC_TARGET" ]; then
              echo "::error::${arch} demande glibc ${max} (> ${GLIBC_TARGET})"
              exit 1
            fi
            run=("$bin")
            if [ "$arch" = arm64 ]; then
              run=(qemu-aarch64-static -L /usr/aarch64-linux-gnu "$bin")
            fi
            "${run[@]}" --version
            data=$(mktemp -d)
            "${run[@]}" --role hub --port 0 --bind 127.0.0.1 --data-dir "$data" > "$data/out.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 60); do
              [ -s "$data/hub/control.json" ] && break
              sleep 1
            done
            kill "$pid" || true
            wait "$pid" || true
            cat "$data/out.log"
            [ -s "$data/hub/control.json" ] || { echo "::error::${arch} : le mode serveur n'a pas démarré"; exit 1; }
            grep -q "rôle hub" "$data/out.log"
          done

      - name: Récupérer le dashboard construit
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist

      - name: Assembler les archives
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          mkdir -p server-dist
          packaging/linux/make-archive.sh "$version" x64 target/x86_64-unknown-linux-gnu/release/corde-server ui-dist server-dist
          packaging/linux/make-archive.sh "$version" arm64 target/aarch64-unknown-linux-gnu/release/corde-server ui-dist server-dist
          ls -l server-dist
          for a in server-dist/*.tar.gz; do tar -tzf "$a" | head -20; done

      - uses: actions/upload-artifact@v4
        with:
          name: corde-server-linux
          path: server-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Application de bureau (installeur Windows)
    needs: web
    runs-on: windows-latest
    env:
      # Version de la CLI Tauri (npm @tauri-apps/cli) : à faire suivre celle du crate `tauri`
      # de apps/desktop/src-tauri/Cargo.lock.
      TAURI_CLI_VERSION: "2.12.4"
      # Signature de code OPTIONNELLE (Azure Artifact Signing, voir docs/adr/0007) : tant que ces
      # secrets et variables n'existent pas dans le dépôt, les étapes de signature sont sautées et
      # l'installeur est construit non signé. Jamais sur une PR : le code d'une PR (même d'une
      # branche du dépôt) ne reçoit pas les secrets de signature.
      AZURE_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && secrets.AZURE_CLIENT_SECRET || '' }}
      AZURE_TENANT_ID: ${{ github.event_name != 'pull_request' && secrets.AZURE_TENANT_ID || '' }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      # Signature des MISES À JOUR (clé minisign de Tauri, sans mot de passe ; sa clé publique est dans
      # tauri.conf.json > plugins > updater > pubkey) — rien à voir avec la signature de code ci-dessus.
      # "true" seulement sur une poussée du dépôt d'origine dont le secret existe : jamais sur une PR ni
      # un fork. Sinon l'installeur est construit sans artefacts de mise à jour (et le build réussit).
      # Le secret lui-même n'est passé qu'à l'étape de construction.
      UPDATER_KEY_PRESENT: ${{ github.event_name == 'push' && github.repository == 'dultra123/corde' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt

      # Le crate de la coquille est un workspace à part : son propre dossier target.
      # cache-on-failure : une erreur de compilation dans notre code ne fait pas perdre les
      # dépendances déjà compilées (Tauri, arrow, parquet…).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-windows
          cache-on-failure: true

      - uses: pnpm/action-setup@v4

      # Pas de cache pnpm ici : ce job ne fait pas de `pnpm install` (seulement `pnpm dlx`),
      # le dossier à mettre en cache n'existe donc pas et l'étape « Post » échouerait.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # L'UI web construite par le job `web` est embarquée comme ressource (bundle.resources → ui/).
      - name: Récupérer le dashboard construit
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: packages/ui/dist

      - name: Format (coquille)
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Préparer la signature de code (optionnelle, inactive sans secrets)
        if: env.AZURE_CLIENT_ID != '' && env.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo install artifact-signing-cli --locked
          # Surcouche de configuration Tauri : la commande signe Corde.exe, l'installeur et le
          # désinstalleur (%1 = fichier à signer). Fichier ignoré par git.
          cat > apps/desktop/tauri.sign.conf.json <<EOF
          {
            "bundle": {
              "windows": {
                "signCommand": "artifact-signing-cli -e ${ARTIFACT_SIGNING_ENDPOINT} -a ${ARTIFACT_SIGNING_ACCOUNT} -c ${ARTIFACT_SIGNING_PROFILE} -d Corde %1"
              }
            }
          }
          EOF
          echo "TAURI_SIGN_ARGS=--config tauri.sign.conf.json" >> "$GITHUB_ENV"

      # tauri.conf.json demande les artefacts de mise à jour (bundle.createUpdaterArtifacts) : sans clé
      # privée, la CLI Tauri refuserait de finir le build (« A public key has been found, but no private
      # key »). Cette surcouche (fichier ignoré par git) les désactive pour ce build seulement.
      - name: Sans clé de mise à jour, installeur sans artefacts de mise à jour
        if: env.UPDATER_KEY_PRESENT != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo '{ "bundle": { "createUpdaterArtifacts": false } }' > apps/desktop/tauri.noupdater.conf.json
          echo "TAURI_UPDATER_ARGS=--config tauri.noupdater.conf.json" >> "$GITHUB_ENV"
          echo "::notice::pas de secret TAURI_SIGNING_PRIVATE_KEY (ou PR, ou fork) : installeur construit sans signature de mise à jour, pas de release numérotée"

      - name: Construire l'installeur (Tauri → NSIS)
        shell: bash
        working-directory: apps/desktop
        env:
          # Lus par la CLI Tauri (bundle.rs, sign_updaters) quand les artefacts de mise à jour sont
          # demandés ; vides (et inutilisés) sinon.
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.UPDATER_KEY_PRESENT == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          # La clé est une ligne base64 : un retour à la ligne collé avec le secret la rendrait illisible.
          TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY}" | tr -d '[:space:]')"
          export TAURI_SIGNING_PRIVATE_KEY
          pnpm dlx "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --ci ${TAURI_SIGN_ARGS:-} ${TAURI_UPDATER_ARGS:-}

      - name: Contrôler l'installeur
        shell: bash
        run: |
          set -euo pipefail
          dir=apps/desktop/src-tauri/target/release/bundle/nsis
          ls -l "$dir"
          count=$(ls "$dir"/*-setup.exe | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::un seul installeur attendu dans $dir, trouvé : $count"
            exit 1
          fi
          setup=$(ls "$dir"/*-setup.exe)
          size=$(stat -c %s "$setup")
          echo "Installeur : $(basename "$setup") — $size octets"
          # Corde.exe embarque le serveur (arrow, parquet, sqlite) : un installeur de moins de
          # 5 Mo serait forcément incomplet.
          if [ "$size" -lt 5000000 ]; then
            echo "::error::installeur anormalement petit ($size octets)"
            exit 1
          fi
          {
            echo "### Installeur Windows"
            echo ""
            echo "\`$(basename "$setup")\` — $((size / 1024 / 1024)) Mo ($size octets)"
          } >> "$GITHUB_STEP_SUMMARY"
          # Signature de mise à jour : écrite par la CLI à côté de l'installeur (<installeur>.sig).
          if [ "${UPDATER_KEY_PRESENT}" = "true" ]; then
            if [ ! -s "${setup}.sig" ]; then
              echo "::error::signature de mise à jour attendue et absente : $(basename "$setup").sig"
              exit 1
            fi
            echo "Signature de mise à jour : $(basename "$setup").sig"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Signature de mise à jour : \`$(basename "$setup").sig\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Contrôler la signature (si signé)
        if: env.AZURE_CLIENT_ID != '' && env.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          $signature = Get-AuthenticodeSignature $setup.FullName
          $signature | Format-List Status, StatusMessage, SignerCertificate
          if ($signature.Status -ne 'Valid') { throw "signature invalide : $($signature.Status)" }

      # Installeur et, s'il existe, sa signature de mise à jour (les deux à la racine de l'artefact).
      - uses: actions/upload-artifact@v4
        with:
          name: corde-setup
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 30

  continuous:
    name: Version continue (pré-release « continuous »)
    # Uniquement quand `main` du dépôt d'origine avance : jamais sur une branche, une PR, un tag
    # ni un fork.
    # Après server-linux aussi, mais un échec de celui-ci ne bloque pas la publication (elle se fait
    # alors sans les archives de Corde serveur) : d'où !cancelled() et les deux résultats exigés.
    if: >-
      !cancelled() && needs.rust.result == 'success' && needs.desktop.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dultra123/corde'
    needs: [rust, desktop, server-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: continuous
    steps:
      # Pour la liste des derniers commits dans les notes.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: corde-setup
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: corde-windows
          path: corde-windows

      - name: Récupérer les archives de Corde serveur
        if: needs.server-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: corde-server-linux
          path: release

      - name: Préparer les fichiers et les notes
        run: |
          set -euo pipefail
          # La signature de mise à jour ne sert que dans la release numérotée (job `version`).
          rm -f release/*.sig
          (cd corde-windows && zip -qr ../release/corde-portable-windows.zip .)
          ls -l release
          setup=$(basename release/*-setup.exe)
          short=${GITHUB_SHA::7}
          when=$(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M')
          docs="https://github.com/${GITHUB_REPOSITORY}/blob/main/docs"
          {
            echo "Version de développement de Corde, reconstruite automatiquement à chaque modification."
            echo "Celle-ci date du **${when}** (commit \`${short}\`)."
            echo ""
            echo "## Installer ou mettre à jour"
            echo ""
            echo "1. Télécharge **\`${setup}\`** tout en bas de cette page (section *Assets*)."
            echo "2. Lance-le. Windows affiche « Windows a protégé votre ordinateur » : clique sur **Informations complémentaires**, puis sur **Exécuter quand même** (explication ci-dessous)."
            echo "3. Suis l'installeur — il ne demande pas de droits administrateur — puis lance **Corde** depuis le menu Démarrer."
            echo ""
            echo "Pour mettre à jour, fais exactement la même chose : le nouvel installeur remplace l'ancienne version. Tes sessions, tes dispositions et tes réglages (\`%LOCALAPPDATA%\\Corde\`) sont conservés. Quitte Corde avant (clic droit sur l'icône près de l'horloge → Quitter)."
            echo ""
            echo "Depuis la 0.6.0, les versions numérotées (pas cette version de développement) s'installent aussi depuis l'application : **Réglages → Mises à jour → Rechercher une mise à jour**."
            echo ""
            echo "Tu avais l'ancienne version (avant 0.3.0, logo « M ») ? Quitte-la, installe Corde : au premier lancement, Corde reprend toutes tes données. Ensuite, désinstalle l'ancienne version. Détails : [passer de l'ancienne version à Corde](${docs}/TESTING-ON-PC.md#passer-de-lancienne-version-avant-030-logo--m--à-corde)."
            echo ""
            echo "Guide complet : [Installer Corde sur ton PC](${docs}/TESTING-ON-PC.md)."
            echo ""
            echo "## Ce qui change"
            echo ""
            git log -15 --pretty='- %s (`%h`)'
            echo ""
            echo "## Fichiers"
            echo ""
            echo "| Fichier | À quoi il sert |"
            echo "|---|---|"
            echo "| \`${setup}\` | **L'application Corde** : une icône, une fenêtre, pas de console. C'est celui qu'il te faut. |"
            echo "| \`corde-portable-windows.zip\` | Mode console (\`corde-server.exe\`, \`lmu-probe.exe\`…) : pour le diagnostic, ou sans installation. |"
            for a in release/corde-server-*-linux-*.tar.gz; do
              [ -e "$a" ] || continue
              case "$a" in
                *-arm64.tar.gz) what="**Corde serveur** pour Raspberry Pi 5 (Raspberry Pi OS 64 bits). Guide : [docs/SERVEUR.md](${docs}/SERVEUR.md)." ;;
                *) what="**Corde serveur** pour un PC Linux 64 bits (x86_64). Guide : [docs/SERVEUR.md](${docs}/SERVEUR.md)." ;;
              esac
              echo "| \`$(basename "$a")\` | ${what} |"
            done
            echo ""
            echo "## Pourquoi Windows affiche un avertissement"
            echo ""
            echo "Corde n'est pas encore **signé numériquement** : Windows SmartScreen ne connaît donc pas son éditeur et affiche « Windows a protégé votre ordinateur » au premier lancement d'un fichier téléchargé. Ce n'est pas une détection de virus. L'avertissement revient à chaque nouvel installeur téléchargé tant que Corde n'est pas signé ; une fois installé, Corde se lance normalement. Les options pour le faire disparaître sont décrites dans [l'ADR 0007](${docs}/adr/0007-windows-smartscreen-signature.md)."
          } > notes.md
          cat notes.md

      # Pré-release « glissante » : on supprime l'ancienne (fichiers et étiquette compris) et on la
      # recrée sur le commit courant — la page porte ainsi la date du dernier build et ne garde
      # jamais d'ancien installeur.
      - name: Publier la pré-release « continuous »
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          for attempt in 1 2 3; do
            if gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Corde — dernière version" \
              --notes-file notes.md; then
              exit 0
            fi
            echo "création refusée (tentative $attempt), nouvel essai dans 10 s"
            sleep 10
          done
          exit 1

  version:
    name: Version numérotée (release v<version> et mises à jour)
    # Uniquement quand `main` du dépôt d'origine avance : jamais sur une branche, une PR, un tag ni un fork.
    # Après server-linux aussi, mais un échec de celui-ci ne bloque pas la publication (elle se fait
    # alors sans les archives de Corde serveur) : d'où !cancelled() et les deux résultats exigés.
    if: >-
      !cancelled() && needs.rust.result == 'success' && needs.desktop.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dultra123/corde'
    needs: [rust, desktop, server-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # tauri.conf.json (version, clé publique), CHANGELOG.md (notes) et le script de publication.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # La version vient de tauri.conf.json (la même que celle de l'installeur et de l'application).
      # Une release déjà publiée pour v<version> : rien à faire. Un brouillon (publication interrompue
      # par une exécution annulée) : supprimé puis refait.
      - name: Une release v<version> existe-t-elle ?
        id: plan
        run: |
          set -euo pipefail
          version=$(python3 -I .github/scripts/updater_manifest.py version apps/desktop/src-tauri/tauri.conf.json)
          tag="v${version}"
          gh release list --limit 1000 --json tagName,isDraft > releases.json
          state=$(python3 -I .github/scripts/updater_manifest.py release-state "$tag" < releases.json)
          echo "Version ${version} (${tag}) : release ${state}"
          if [ "$state" = "draft" ]; then
            echo "::warning::brouillon ${tag} laissé par une publication interrompue : supprimé, puis refait"
            gh release delete "$tag" --yes
            state=absent
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "publish=$([ "$state" = "absent" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: corde-setup
          path: release

      - uses: actions/download-artifact@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          name: corde-windows
          path: corde-windows

      - name: Récupérer les archives de Corde serveur
        if: steps.plan.outputs.publish == 'true' && needs.server-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: corde-server-linux
          path: release

      # Sans signature de mise à jour (secret absent), pas de release numérotée : l'application ne
      # pourrait pas l'installer. La pré-release `continuous` reste publiée.
      - name: Signature de mise à jour présente ?
        id: sig
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          ls -l release
          setup="release/Corde_${VERSION}_x64-setup.exe"
          if [ ! -f "$setup" ]; then
            echo "::error::installeur attendu introuvable : $(basename "$setup")"
            exit 1
          fi
          if [ -s "${setup}.sig" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pas de signature de mise à jour (secret TAURI_SIGNING_PRIVATE_KEY absent ?) : release v${VERSION} non créée"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # latest.json au format de tauri-plugin-updater ; le script vérifie aussi que la signature a été
      # faite par la clé dont la clé publique est dans tauri.conf.json, pour cette version et ce fichier.
      - name: Préparer latest.json, l'archive portable et les notes
        if: steps.plan.outputs.publish == 'true' && steps.sig.outputs.ok == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/updater_manifest.py manifest \
            --conf apps/desktop/src-tauri/tauri.conf.json \
            --changelog CHANGELOG.md \
            --setup "release/Corde_${VERSION}_x64-setup.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --out release/latest.json \
            --notes-out notes.md
          (cd corde-windows && zip -qr "../release/corde-${VERSION}-portable-windows.zip" .)
          ls -l release
          cat release/latest.json

      # Créée en brouillon (fichiers envoyés), puis publiée et marquée « latest » : une exécution
      # interrompue ne laisse jamais une release publiée sans latest.json. L'étiquette est créée à la
      # publication, sur le commit construit.
      - name: Publier la release v<version>
        if: steps.plan.outputs.publish == 'true' && steps.sig.outputs.ok == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Corde ${VERSION}" \
            --notes-file notes.md
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG"
          {
            echo "### Release ${TAG} publiée"
            echo ""
            echo "Mises à jour : https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release GitHub (étiquette manuelle)
    # Uniquement sur une étiquette v* poussée dans le dépôt d'origine (jamais sur une PR ni un fork).
    if: >-
      !cancelled() && needs.rust.result == 'success' && needs.desktop.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'dultra123/corde'
    needs: [rust, desktop, server-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Nom de l'étiquette : passé par l'environnement, jamais collé dans le script.
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Déjà publiée par le job `version` (même numéro) : on n'y touche pas.
      - name: La release de cette étiquette existe-t-elle déjà ?
        id: existing
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::release ${VERSION} déjà publiée (job version) : rien à faire"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.found != 'true'
        with:
          name: corde-windows
          path: corde-windows

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.found != 'true'
        with:
          name: corde-linux
          path: corde-linux

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.found != 'true'
        with:
          name: corde-setup
          path: corde-setup

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.found != 'true' && needs.server-linux.result == 'success'
        with:
          name: corde-server-linux
          path: corde-server-linux

      - name: Créer les archives
        if: steps.existing.outputs.found != 'true'
        run: |
          set -euo pipefail
          (cd corde-windows && zip -r "../corde-${VERSION}-windows.zip" \
            corde-server.exe lmu-probe.exe corde-sim.exe corde-store.exe ui docs/TESTING-ON-PC.md README.md)
          tar -C corde-linux -czf "corde-${VERSION}-linux.tar.gz" .
          ls -l corde-*.zip corde-*.tar.gz corde-setup

      # Jamais « latest » : la release « latest » est celle du job `version`, la seule qui porte un
      # latest.json (adresse lue par les mises à jour de l'application).
      - uses: softprops/action-gh-release@v2
        if: steps.existing.outputs.found != 'true'
        with:
          files: |
            corde-setup/*-setup.exe
            corde-*-windows.zip
            corde-*-linux.tar.gz
            corde-server-linux/corde-server-*-linux-*.tar.gz
          generate_release_notes: true
          # Les archives de Corde serveur peuvent manquer (job server-linux en échec) : le motif
          # correspondant ne fait pas échouer la publication. Les trois autres sont contrôlés
          # par l'étape « Créer les archives » ci-dessus.
          fail_on_unmatched_files: false
          make_latest: "false"

  deny:
    name: Dépendances Rust (cargo-deny, informatif)
    # Non bloquant : un avis de sécurité tout neuf ou une licence à examiner ne doit pas empêcher
    # de publier ; le résultat se lit dans le journal du job. Aucun autre job n'en dépend.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # deny.toml est lu dans le dossier courant (racine du dépôt) pour les deux workspaces.
      - name: Serveur, outils et bibliothèques (workspace racine)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Application de bureau (apps/desktop/src-tauri)
        if: always()
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          command: check
