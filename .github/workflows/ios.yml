# Application iPhone (apps/mobile, Capacitor) — compilée seulement ici : personne dans le projet n'a
# de Mac. Voir docs/IOS.md.
#
# simulator  : toujours. Interface en mode mobile, `cap sync ios`, compilation Debug pour le
#              simulateur (application et extension de widgets) avec une signature locale ad hoc
#              (aucun certificat, aucun secret), puis essai de fumée : un simulateur iPhone choisi
#              dans `xcrun simctl list`, installation, trois lancements — Accueil ; Courses par le
#              lien corde://races, ouvert par l'application elle-même comme un toucher de widget ;
#              planches des vues des widgets et de l'activité en direct dessinées par
#              l'application (build Debug, données inventées) —, images réduites en JPEG et
#              écrites EN BASE64 DANS LE JOURNAL entre deux marqueurs
#                -----BEGIN CORDE SCREENSHOT <nom>-----
#                -----END CORDE SCREENSHOT-----
#              (le seul moyen pour l'équipe de voir l'écran), et les journaux de l'application.
#              Les mêmes fichiers sont aussi joints à l'exécution (artefact).
# cle-api    : en une minute, sans attendre le simulateur : essais des scripts (clé d'API avec une
#              clé jetable, signature avec un faux serveur d'Apple et un faux codesign, cohérence
#              du projet Xcode), puis contrôle des quatre secrets s'ils existent. Un secret mal
#              collé donne ici un message clair (longueur et forme seulement, jamais la valeur).
# testflight : seulement sur le dépôt d'origine, jamais sur une PR ni un fork, et seulement si les
#              quatre secrets APPSTORE_API_KEY, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID et
#              APPLE_TEAM_ID existent (clé d'API d'accès Admin). Un certificat « Apple
#              Distribution » et un profil App Store par identifiant (l'application et son
#              extension de widgets, dont l'identifiant est créé s'il manque) sont créés pour
#              l'exécution par l'API App Store Connect (apps/mobile/scripts/ios-signing.sh ; ceux
#              de l'exécution précédente sont révoqués / supprimés), l'archive Release est signée
#              avec, contrôlée, puis exportée avec envoi direct vers TestFlight. Numéro de build =
#              numéro d'exécution de ce workflow (le même pour l'application et l'extension).
#
# Branches : lancé à la main sur une autre branche que `main` (Run workflow → choisir la branche),
# le workflow compile pour le simulateur et essaie les scripts, sans lire aucun secret et sans rien
# envoyer à Apple. C'est le moyen d'essayer du code Swift avant de le fusionner.
#
# Sécurité : jeton en lecture seule ; aucune valeur venant d'un tiers (nom de branche…) n'est
# collée dans un script ; la clé .p8 n'est écrite que dans un dossier temporaire du runner, en
# 0600, et effacée à la fin même en cas d'échec ; elle n'est jamais affichée. La clé privée du
# certificat de distribution naît sur le runner, va dans un trousseau temporaire et disparaît avec
# lui. Le nom du certificat (qui contient le nom du titulaire du compte) est masqué dans le journal.

name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/ui/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUNDLE_ID: io.github.dultra123.corde
  # Extension de widgets (cible CordeWidgets) : son identifiant est créé par l'API au premier envoi.
  WIDGETS_BUNDLE_ID: io.github.dultra123.corde.widgets

jobs:
  simulator:
    name: Simulateur (compilation, essai de fumée, vues des widgets)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Version de pnpm lue dans le champ `packageManager` de package.json, comme dans ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # La compilation de l'interface n'a pas besoin des types générés du protocole (ts-rs) :
      # `vite build` retire les imports de types (le typecheck se fait dans ci.yml).
      - name: Interface en mode mobile (apps/mobile/www)
        run: pnpm --filter @corde/mobile build

      - name: Copier l'interface dans le projet Xcode (cap sync ios)
        working-directory: apps/mobile
        run: pnpm exec cap sync ios

      - name: Outils disponibles
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Choisir un simulateur iPhone
        id: sim
        run: |
          set -euo pipefail
          # Même appel et même forme que native-run (l'outil d'Ionic derrière `cap run ios`) :
          # `devices` indexé par l'identifiant du runtime, `isAvailable`, `udid`, `name`.
          xcrun simctl list --json > "$RUNNER_TEMP/devices.json"
          # Le runtime iOS le plus récent (17 au moins : cible de déploiement du projet), un
          # iPhone de taille courante de préférence.
          python3 - "$RUNNER_TEMP/devices.json" > "$RUNNER_TEMP/sim.txt" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))["devices"]
          best = None
          for runtime, devices in data.items():
              m = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              if version < (17, 0):
                  continue
              for d in devices:
                  name = d.get("name", "")
                  if not name.startswith("iPhone") or d.get("isAvailable") is False:
                      continue
                  usual = re.search(r"\b(SE|mini|Plus|Max)\b", name) is None
                  key = (version, usual, name)
                  if best is None or key > best[0]:
                      best = (key, d["udid"], name, runtime)
          if best is None:
              sys.exit("aucun simulateur iPhone (iOS 17 ou plus) disponible")
          print(best[1])
          print(f"{best[2]} — {best[3]}")
          PY
          udid=$(sed -n 1p "$RUNNER_TEMP/sim.txt")
          label=$(sed -n 2p "$RUNNER_TEMP/sim.txt")
          echo "Simulateur : ${label} (${udid})"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      # Signature locale « ad hoc » (identité « - », aucun certificat ni équipe) : sur le
      # simulateur, elle suffit pour que les droits (trousseau partagé entre l'application et
      # l'extension de widgets) soient appliqués, et que l'essai de fumée exerce le vrai chemin
      # écriture → lecture. Si Xcode la refuse, la compilation est refaite sans signature (le
      # trousseau retombe alors sur celui de l'application seule, SharedStore.swift).
      - name: Compiler pour le simulateur (Debug, signature locale)
        working-directory: apps/mobile/ios/App
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(node -p "require('../../package.json').version")
          echo "Corde ${version} (${BUILD_NUMBER})"
          build() {
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -destination "id=${UDID}" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -quiet \
              MARKETING_VERSION="${version}" \
              CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
              "$@" \
              build
          }
          if build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=; then
            echo "SIM_SIGNING=adhoc" >> "$GITHUB_ENV"
          else
            echo "::warning::signature locale refusée : compilation sans signature (le trousseau partagé n'est pas essayé)"
            build CODE_SIGNING_ALLOWED=NO
            echo "SIM_SIGNING=none" >> "$GITHUB_ENV"
          fi
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          appex="$app/PlugIns/CordeWidgets.appex"
          test -d "$app"
          test -d "$appex" || { echo "::error::extension de widgets absente de l'application (PlugIns/CordeWidgets.appex)"; exit 1; }
          keys='CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|CFBundleDisplayName|MinimumOSVersion|NSSupportsLiveActivities|NSExtensionPointIdentifier'
          echo "Application :"
          plutil -p "$app/Info.plist" | grep -E "$keys"
          echo "Extension de widgets :"
          plutil -p "$appex/Info.plist" | grep -E "$keys"
          for plist in "$app/Info.plist" "$appex/Info.plist"; do
            [ "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$version" ] ||
              { echo "::error::version différente de ${version} dans ${plist##*/Products/}"; exit 1; }
            [ "$(plutil -extract CFBundleVersion raw "$plist")" = "$BUILD_NUMBER" ] ||
              { echo "::error::numéro de build différent de ${BUILD_NUMBER} dans ${plist##*/Products/}"; exit 1; }
          done
          echo "Droits (simulateur, sans équipe) :"
          for bundle in "$app" "$appex"; do
            codesign -d --entitlements - --xml "$bundle" 2> /dev/null | plutil -p - 2> /dev/null ||
              echo "  ${bundle##*/} : aucun droit lisible"
          done
          du -sh "$app" "$appex"
          echo "APP_PATH=${app}" >> "$GITHUB_ENV"

      - name: Essai de fumée (lancement, captures d'écran, journal)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/smoke"
          mkdir -p "$out"

          # Capture → JPEG de 390 px de large → base64 entre les deux marqueurs.
          shot() {
            local name="$1"
            xcrun simctl io "$UDID" screenshot "$out/${name}.png"
            sips --resampleWidth 390 -s format jpeg -s formatOptions 70 \
              "$out/${name}.png" --out "$out/${name}.jpg" > /dev/null
            echo "-----BEGIN CORDE SCREENSHOT ${name}-----"
            python3 -c 'import base64, sys, textwrap; print("\n".join(textwrap.wrap(base64.b64encode(open(sys.argv[1], "rb").read()).decode(), 76)))' "$out/${name}.jpg"
            echo "-----END CORDE SCREENSHOT-----"
          }

          # Une planche de vues dessinée par l'application (Documents/corde-shots) → JPEG de
          # 1100 px de large → base64 entre les deux marqueurs.
          sheet() {
            local name="$1" file="$2"
            sips --resampleWidth 1100 -s format jpeg -s formatOptions 72 \
              "$file" --out "$out/${name}.jpg" > /dev/null
            echo "-----BEGIN CORDE SCREENSHOT ${name}-----"
            python3 -c 'import base64, sys, textwrap; print("\n".join(textwrap.wrap(base64.b64encode(open(sys.argv[1], "rb").read()).decode(), 76)))' "$out/${name}.jpg"
            echo "-----END CORDE SCREENSHOT-----"
          }

          # launch <n° du lancement> [arguments de l'application] : sorties dans run<n>-*.log.
          # (La sortie standard de l'application — la console JavaScript passe par CAPLog.print —
          # est écrite ligne par ligne en build Debug ; NSLog va dans la sortie d'erreur.)
          launch() {
            local n="$1"
            shift
            xcrun simctl launch --stdout="$out/run${n}-stdout.log" --stderr="$out/run${n}-stderr.log" \
              "$UDID" "$BUNDLE_ID" "$@"
          }

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"

          # 1. Lancement normal : Accueil. La partie JavaScript écrit le bloc des widgets.
          launch 1
          sleep 20
          shot home

          # 2. Page Courses par le lien corde://races, comme un toucher de widget : l'application
          #    (déjà ouverte) ouvre elle-même le lien après 12 s (WidgetShots.swift, build Debug).
          #    `simctl openurl` ne sert pas : iOS y répond par la fenêtre « Ouvrir dans
          #    “Corde” ? » (c'est ce que montraient les captures identiques des exécutions
          #    précédentes), qu'aucun outil de ligne de commande ne sait toucher.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          launch 2 -CordeOpenURL corde://races -CordeOpenDelay 12
          sleep 24
          shot races

          # 3. Vues des widgets et de l'activité en direct, dessinées par l'application avec
          #    des données inventées ; relecture du bloc écrit au lancement 1.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          launch 3 -CordeRenderShots
          data="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          for _ in $(seq 1 60); do
            [ -f "$data/Documents/corde-shots/done.txt" ] && break
            sleep 1
          done
          if [ -f "$data/Documents/corde-shots/done.txt" ]; then
            for file in "$data"/Documents/corde-shots/*.png; do
              [ -e "$file" ] || continue
              cp "$file" "$out/"
              name="$(basename "$file" .png)"
              sheet "$name" "$file"
            done
          else
            echo "::warning::les vues des widgets n'ont pas été dessinées (voir le journal du lancement 3)"
          fi

          # 4. Une activité en direct d'exemple, dessinée cette fois par la vraie extension : Corde
          #    la démarre, puis Réglages passe au premier plan — la Dynamic Island (simulateur
          #    d'un iPhone qui en a une) montre alors la vue compacte de l'activité.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          launch 4 -CordeDemoActivity
          sleep 12
          xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null || echo "::warning::Réglages ne s'ouvre pas"
          sleep 6
          shot island
          xcrun simctl launch "$UDID" "$BUNDLE_ID" > /dev/null || true

          echo "::group::Lignes de Corde (tous les lancements)"
          grep -h -E '\[corde(-native)?\]' "$out"/run*-std*.log || echo "(aucune)"
          echo "::endgroup::"
          for n in 1 2 3 4; do
            echo "::group::Journal du lancement ${n} (stdout, 120 dernières lignes)"
            tail -n 120 "$out/run${n}-stdout.log" || true
            echo "::endgroup::"
            echo "::group::Journal du lancement ${n} (stderr, 60 dernières lignes)"
            tail -n 60 "$out/run${n}-stderr.log" || true
            echo "::endgroup::"
          done
          echo "::group::Journal du système pour le processus App (200 dernières lignes)"
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "App"' > "$out/system.log" 2>&1 || true
          tail -n 200 "$out/system.log" || true
          echo "::endgroup::"

          # L'application tourne-t-elle encore ?
          running="$(xcrun simctl spawn "$UDID" launchctl list 2> /dev/null || true)"
          if printf '%s\n' "$running" | grep -q "$BUNDLE_ID"; then
            echo "L'application tourne toujours."
          else
            echo "::warning::l'application ne semble plus tourner (voir les journaux ci-dessus)"
          fi
          # Ce que les journaux doivent montrer (avertissements seulement : les captures ci-dessus
          # restent la preuve à regarder).
          check() {
            local what="$1" pattern="$2" files="$3"
            # shellcheck disable=SC2086
            if grep -q -E "$pattern" $files 2> /dev/null; then
              echo "✓ ${what}"
            else
              echo "::warning::${what} : absent du journal"
            fi
          }
          check "démarrage de l'interface" "application started" "$out/run1-stdout.log"
          check "bloc des widgets écrit par l'application (trousseau, OSStatus 0)" "widgets: [0-9]+ bytes, OSStatus 0" "$out/run1-stderr.log"
          check "lien corde://races reçu par l'interface" "link: #/races" "$out/run2-stdout.log"
          check "bloc relu comme le lit l'extension" "store read: OSStatus 0, [0-9]+ bytes, version 1" "$out/run3-stderr.log"
          check "vues des widgets dessinées" "shots: [1-9]" "$out/run3-stderr.log"
          check "activité en direct d'exemple démarrée" "demo activity: started" "$out/run4-stderr.log"
          echo "Signature du simulateur : ${SIM_SIGNING:-?}"

      - name: Joindre les captures et les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14

  # Réponse en une minute, sans attendre le simulateur : le script qui prépare la clé d'API est
  # essayé avec une clé jetable (même bash 3.2, même openssl que le job TestFlight), puis, si les
  # secrets existent, avec les vrais — rien n'est affiché que la forme des valeurs.
  cle-api:
    name: Clé d'API (script et secrets)
    if: github.repository == 'dultra123/corde' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      ASC_READY: ${{ github.ref == 'refs/heads/main' && secrets.APPSTORE_API_KEY != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Essais du script (clé jetable)
        run: bash apps/mobile/scripts/asc-key.test.sh

      - name: Essais des scripts de signature (faux serveur d'Apple)
        run: node --test apps/mobile/scripts/signing.test.mjs

      - name: Essais du contrôle de l'archive (faux codesign)
        run: bash apps/mobile/scripts/ios-signing.test.sh

      - name: Cohérence du projet Xcode (deux cibles, extension embarquée, réglages)
        run: node --test apps/mobile/scripts/xcodeproj.test.mjs

      - name: Les quatre secrets sont-ils utilisables ?
        if: env.ASC_READY == 'true'
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash apps/mobile/scripts/asc-key.sh "$RUNNER_TEMP/asc-check"

      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc-check"

  testflight:
    name: TestFlight (archive signée et envoi)
    needs: [simulator, cle-api]
    # Jamais sur un fork ni une PR (ce workflow n'a pas de déclencheur pull_request : la
    # condition le garantit aussi s'il en recevait un), et seulement depuis `main` : lancé à la
    # main sur une autre branche, le workflow compile pour le simulateur et s'arrête là.
    if: github.repository == 'dultra123/corde' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # « true » seulement si les quatre secrets existent (sinon le job ne fait rien).
      ASC_READY: ${{ github.ref == 'refs/heads/main' && secrets.APPSTORE_API_KEY != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Secrets App Store Connect présents ?
        run: |
          if [ "${ASC_READY}" != "true" ]; then
            echo "::notice::secrets App Store Connect absents (APPSTORE_API_KEY, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPLE_TEAM_ID) : pas d'envoi vers TestFlight (docs/IOS.md)"
          fi

      - uses: actions/checkout@v5
        if: env.ASC_READY == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        if: env.ASC_READY == 'true'

      - uses: actions/setup-node@v5
        if: env.ASC_READY == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Interface en mode mobile et cap sync ios
        if: env.ASC_READY == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @corde/mobile build
          cd apps/mobile
          pnpm exec cap sync ios

      # La clé .p8 est écrite dans un dossier temporaire du runner, lisible par ce seul compte,
      # jamais affichée. Le script accepte les façons courantes de coller la clé (fins de ligne
      # Windows, une seule ligne, sans les lignes BEGIN/END, fichier en base64), retire les
      # espaces autour des identifiants et donne ASC_KEY_PATH, ASC_KEY_ID, ASC_ISSUER_ID et
      # ASC_TEAM_ID aux étapes suivantes.
      - name: Clé d'API App Store Connect (fichier temporaire)
        if: env.ASC_READY == 'true'
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash apps/mobile/scripts/asc-key.sh "$RUNNER_TEMP/asc"

      # Signature : un certificat « Apple Distribution » et un profil App Store sont créés pour
      # cette exécution par l'API App Store Connect ; la clé privée naît sur ce runner et n'en sort
      # pas. (La « signature dans le cloud » d'Apple, essayée d'abord sur une archive signée
      # ad hoc, donne un fichier qu'Apple refuse à l'envoi : « Invalid Signature », code 90035.)
      - name: Certificat et profils de distribution (application et widgets, pour cette exécution)
        if: env.ASC_READY == 'true'
        run: bash apps/mobile/scripts/ios-signing.sh setup "$RUNNER_TEMP/signing"

      - name: Archive Release (signée pour la distribution)
        if: env.ASC_READY == 'true'
        working-directory: apps/mobile/ios/App
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(node -p "require('../../package.json').version")
          echo "Corde ${version} (${BUILD_NUMBER}) pour TestFlight"
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Corde.xcarchive" \
            -quiet \
            MARKETING_VERSION="${version}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            archive

      - name: Contrôler la signature de l'archive
        if: env.ASC_READY == 'true'
        run: bash apps/mobile/scripts/ios-signing.sh check "$RUNNER_TEMP/Corde.xcarchive/Products/Applications/App.app"

      - name: Exporter et envoyer vers TestFlight
        if: env.ASC_READY == 'true'
        run: |
          set -euo pipefail
          plist="$RUNNER_TEMP/exportOptions.plist"
          cat > "$plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${SIGN_PROFILE_NAME}</string>
              <key>${WIDGETS_BUNDLE_ID}</key>
              <string>${SIGN_PROFILE_NAME_WIDGETS}</string>
            </dict>
            <key>teamID</key>
            <string>${ASC_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Corde.xcarchive" \
            -exportOptionsPlist "$plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          {
            echo "### Envoyé vers TestFlight"
            echo ""
            echo "Build ${GITHUB_RUN_NUMBER} : il apparaît dans App Store Connect → TestFlight après le traitement par Apple (souvent 5 à 30 minutes)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer le trousseau et le profil
        if: always()
        run: |
          if [ -f apps/mobile/scripts/ios-signing.sh ]; then
            bash apps/mobile/scripts/ios-signing.sh teardown "$RUNNER_TEMP/signing"
          fi

      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
