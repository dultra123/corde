<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Corde</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <!--
      Page locale de la coquille de bureau (frontendDist). Elle ne s'affiche que le temps
      que le serveur embarqué réponde, puis la coquille navigue vers l'UI servie par ce
      serveur (http://127.0.0.1:<port>/#/home). Si le serveur ne démarre pas, c'est ici
      que l'erreur est affichée. Aucune dépendance, aucun build : ces fichiers sont
      embarqués tels quels dans l'exécutable.
    -->
    <main class="splash" id="splash" data-phase="starting">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#131920" />
        <path d="M23.39 9.11A9 9 0 1 0 23.39 22.89" fill="none" stroke="#ffb454" stroke-width="5" stroke-linecap="round" />
        <circle cx="14.7" cy="16" r="2.8" fill="#ffb454" />
      </svg>

      <section class="state state-starting" aria-live="polite">
        <h1>Démarrage de Corde…</h1>
        <div class="bar" role="progressbar" aria-label="Démarrage en cours"><span></span></div>
        <p class="hint" id="starting-hint">Ouverture de la base de sessions et du serveur local.</p>
      </section>

      <section class="state state-failed" aria-live="assertive">
        <h1>Corde n'a pas pu démarrer</h1>
        <p class="message" id="error-message"></p>
        <p class="hint">
          Le détail est dans le journal&nbsp;:
          <code class="path" id="log-path"></code>
        </p>
        <div class="actions">
          <button type="button" id="retry">Réessayer</button>
          <button type="button" id="copy-log" class="secondary">Copier le chemin du journal</button>
        </div>
        <p class="hint small">
          Fermer cette fenêtre quitte Corde. Si le problème revient, envoie-nous le fichier
          journal.
        </p>
      </section>

      <footer class="version" id="version"></footer>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
