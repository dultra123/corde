import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Corde for Android (docs/ANDROID.md, ADR 0013).
//
// Version name: the one of apps/mobile/package.json (the same as the iPhone application).
// Version code: the run number of the Android workflow (always increasing), given by the CI
// with -PcordeVersionCode=<n>; 1 for a local build.
def mobilePackage = new JsonSlurper().parse(file("../../package.json"))
def cordeVersionCode = (project.findProperty("cordeVersionCode") ?: "1").toString().toInteger()
// Release signing, only when the CI gives the owner's keystore (PKCS12, alias `corde`, the same
// password for the store and the key: apps/mobile/scripts/android-signing.sh). Without it the
// Release build is unsigned. Never a keystore in the repository.
def keystorePath = System.getenv("CORDE_KEYSTORE_FILE")
def keystorePassword = System.getenv("CORDE_KEYSTORE_PASSWORD")
def signRelease = keystorePath != null && !keystorePath.isEmpty()

android {
    namespace = "io.github.dultra123.corde"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.dultra123.corde"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode cordeVersionCode
        versionName mobilePackage.version
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signRelease) {
            release {
                storeFile file(keystorePath)
                storeType "pkcs12"
                storePassword keystorePassword
                keyAlias "corde"
                keyPassword keystorePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
    // No dependency block encrypted for Google in the APK or the bundle (it is only read by the
    // Play Console).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    lint {
        abortOnError = true
        // The findings in the CI's log too (the HTML report is in the `android-reports` artifact).
        textReport = true
        textOutput = file("stdout")
        // Versions of the build tools and of the SDK are chosen with Capacitor, not by lint.
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion', 'OldTargetApi'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// No Google services in Corde (ADR 0013): the QR code scanner (@capacitor/barcode-scanner) also
// depends on Google's ML Kit, which needs Google's libraries and sends usage reports to Google.
// Corde asks for its other library (ZXing, packages/ui/src/mobile/platform.ts): ML Kit and
// everything of Google Play services and Firebase are left out of the application. The CI
// checks the dependencies and the code of the APK for them.
configurations.configureEach {
    exclude group: "com.google.mlkit"
    exclude group: "com.google.android.gms"
    exclude group: "com.google.firebase"
    exclude group: "com.google.android.datatransport"
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
