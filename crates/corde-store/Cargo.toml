[package]
name = "corde-store"
description = "Enregistrement des sessions Corde : SQLite (sessions / tours / événements / setups) + échantillons Parquet (zstd), lecture et décimation pour les graphes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "corde-store"
path = "src/bin/corde-store.rs"

[dependencies]
corde-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
arrow-array = "59"
arrow-schema = "59"
arrow-buffer = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"] }
# Already pulled in by parquet: used directly to compress the imported results JSON.
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
