# knowledge/feedback-dictionary.yaml — ressenti pilote (texte libre FR/EN) → symptômes de setup.
#
# GÉNÉRÉ depuis docs/research/02-ingenieur-de-course.md (section D) puis nettoyé. Schéma dans
# knowledge/README.md. Les expressions françaises sont des formulations courantes de pilotes sim
# (non sourçables, confiance medium) ; les symptômes pointent vers `symptom` de setup-rules.yaml.
# Un symptôme terminé par `*` est un motif (glob) : US_* = toutes les règles de sous-virage, etc.
# Les 5 entrées de la section `aliases` ont été ajoutées pour résoudre des identifiants référencés
# par les règles mais absents de la table du brief ; elles héritent des expressions de leur cible.

schema_version: 1
source: "docs/research/02-ingenieur-de-course.md"
confidence: medium

# Prétraitement recommandé avant la recherche de motifs : minuscules, suppression des accents,
# lemmatisation légère ; recherche par regex ou par similarité (embeddings). Chaque motif reconnu
# renvoie un identifiant FEEL_* ; si plusieurs symptômes sont candidats et que la télémétrie ne
# tranche pas, poser les questions `clarify` dans l'ordre.
normalisation:
  lowercase: true
  strip_accents: true
  light_lemmatisation: true

# Protocole de débrief (≈ 60 s), ordre recommandé des questions.
debrief_protocol:
  - "phase du virage (entrée / milieu / sortie / freinage en ligne droite)"
  - "vitesse du virage (lent / moyen / rapide)"
  - "début ou fin de relais"
  - "pneus : température et pression vues au HUD"
  - "Hypercar : état de charge batterie et réglages TC/map au moment du symptôme"
  - "« est-ce que c'est pire qu'avant la dernière modification ? »"

# Ambiguïtés fréquentes à lever systématiquement.
ambiguities:
  - {expression: "« ça glisse » sans précision", resolve: "demander l'essieu (avant/arrière) et la phase (freins / sans pédale / gaz)."}
  - {expression: "« instable »", resolve: "ligne droite au freinage (BRK_UNSTABLE_STRAIGHT) vs entrée en virage (OS_ENTRY_*) vs haute vitesse (OS_*_FAST)."}
  - {expression: "« pas de grip »", resolve: "froid (TYR_COLD) vs surchauffe (TYR_HOT_*) vs équilibre (US_*/OS_*)."}
  - {expression: "« ça saute »", resolve: "vibreurs (PLT_KERB_UNSETTLED) vs bosses (PLT_BUMPY_LOSS) vs talonnage (PLT_BOTTOMING)."}
  - {expression: "symptôme final vs cause amont", resolve: "le pilote décrit souvent la conséquence (« tête-à-queue en sortie ») alors que la cause est en amont (entrée trop rapide, freinage tardif) : croiser avec S-08 (vitesse mini) et S-02 (trail braking) avant de modifier le setup."}

