# knowledge/setup-parameters.yaml — paramètres de setup de Le Mans Ultimate, par classe.
#
# Sources : docs/research/02-ingenieur-de-course.md (section A : tableaux A.1 Hypercar, A.2 LMP2,
# A.3 LMGT3, A.4 fenêtres thermiques, A.5 BoP) et docs/research/01-telemetrie-lmu.md (§2 API REST,
# §3 format des fichiers .svm lus sur de vrais fichiers). Schéma décrit dans knowledge/README.md.
#
# RÈGLE D'ARCHITECTURE (brief 02) : ne jamais coder en dur les bornes ni les pas. Les plages ci-dessous
# sont INDICATIVES (confiance low/medium) et servent à des contrôles de vraisemblance ; la plage réelle
# d'une voiture se lit à l'exécution dans `minValue` / `maxValue` de GET /rest/garage/getPlayerGarageData
# (objets VM_*), ou dans `metadata.CarSetup` des fichiers DuckDB natifs, ou dans le fichier .svm.
#
# Conventions :
#   * `id` = identifiant canonique utilisé par knowledge/setup-rules.yaml (`param`).
#   * `svm` : section INI et clé du fichier UserData\player\Settings\<Circuit>\*.svm. La valeur stockée
#     est un INDEX de cran ; la valeur affichée par le jeu suit après `//` (ex. `PressureSetting=12//130 kPa`).
#     `per_wheel: true` = la clé existe dans [FRONTLEFT], [FRONTRIGHT], [REARLEFT], [REARRIGHT] ; une
#     règle « front » s'applique aux deux roues avant (respecter `Symmetric=1` du [GENERAL]).
#     `confidence` de la clé : high = lue dans un fichier réel (brief 01), medium = héritage rF2 probable.
#   * `rest_key` : objet VM_* de getPlayerGarageData quand il est connu (snapshot figé au garage).
#   * `live_field` : champ du protocole Corde quand la valeur courante est exposée en roulant par la
#     mémoire partagée (LMU ≥ 1.3) ; `live_adjustable` = modifiable depuis le volant / MFD en roulant.
#   * `classes` : valeurs de VehicleClass du protocole (hypercar, lmp2, lmp3, gt3) où le paramètre existe.
#   * `bop_locked` : false | true | "partial: …" (le BoP contraint la plage sans la figer).
#   * `typical_range` : ordres de grandeur par classe, avec la confiance du brief (H/M/L → high/medium/low).
#   * `default_step` : « cran d'ingénieur » par défaut (brief 02 §C.0, confiance medium).
#   * `svm.index_sign` (schéma v2) : sens de l'INDEX du fichier pour le « + » du paramètre (setup-rules.params[].sign) :
#     +1 = index ↑ quand le paramètre augmente, −1 = l'inverse (carrossage : index ↑ = moins négatif ; répartition :
#     index ↑ = plus à l'arrière ; écopes : index ↑ = plus fermé ; angle de braquage : index ↑ = plus de degrés),
#     0 = valeur discrète ou sens inconnu (Corde ne la change pas). Constaté sur 6 fichiers réels (3 voitures).
#   * `index_step` (schéma v2) : pas physique d'un cran par défaut {value, unit, confidence, source}, utilisé pour
#     convertir une magnitude (« −3 kPa ») en crans quand la bibliothèque du pilote ne permet pas d'apprendre le pas
#     de SA voiture ; seuls les pas de confiance medium/high servent, sinon « 1 cran » et une note.
#   * `svm.label_is_index` (schéma v2) : le jeu affiche le numéro de l'index (cartographies TC : `8//8`) ; quand le
#     libellé du fichier le confirme, Corde écrit le nouveau numéro comme libellé.
#   * `svm_translation` (schéma v2) : paramètre logique sans clé (`aero.rake`) traduit en un paramètre réel.

schema_version: 2
sources:
  - "docs/research/02-ingenieur-de-course.md"
  - "docs/research/01-telemetrie-lmu.md"
  - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"
  - "https://lemansultimate.wiki.gg/wiki/Setup_Guide"
  - "https://configuracion.patagoniasimracing.cl/en/setups/lmu"
  - "https://github.com/seralaci/Le-Mans-Ultimate-Setups"

# Structure d'un fichier .svm (brief 01 §3, vérifié sur fichier réel Hypercar BMW M Hybrid V8).
svm_format:
  location: "<install LMU>\\UserData\\player\\Settings\\<DossierCircuit>\\<nom>.svm (un dossier par circuit ; la voiture est encodée dans le fichier, pas dans le nom)"
  header_lines:
    - "VehicleClassSetting=\"<classe/voiture/saison, ordre des mots variable>\"  (obligatoire, doit correspondre à la voiture sinon le setup n'apparaît pas)"
    - "UpgradeSetting=(a,b,c,d)"
    - "//VEH=…  //UpgradeClass=  //Tyre Restrictions=  //AI Tweaks=  //Atmos Conditions=  (commentaires)"
  sections: [GENERAL, LEFTFENDER, RIGHTFENDER, FRONTWING, REARWING, BODYAERO, SUSPENSION, CONTROLS, ENGINE, DRIVELINE, FRONTLEFT, FRONTRIGHT, REARLEFT, REARRIGHT, BASIC]
  value_form: "<Clé>=<index>//<valeur affichée>   (« settings commented out if using the default »)"
  encoding: "ASCII, fins de ligne CRLF (à confirmer sur le PC du client)"
  reload: "bouton Refresh de l'écran setups du jeu ; pas de redémarrage"
  class_differences: "jeu de clés identique entre classes (Gear7Setting disparaît sur GT3) ; ce qui change : libellés « N/A » / « Non-adjustable » et plages"
  confidence: high

parameters:

  # ===== Aéro =========================================================================================
  - id: aero.rear_wing
    label_fr: "Aileron arrière"
    group: aero
    svm: {section: REARWING, key: RWSetting, per_wheel: false, confidence: high, index_sign: 1}
    unit: "cran (Hypercar : P1…P20) ou degrés (LMGT3)"
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: "partial: LMGT3 angle minimum imposé par circuit (ex. Ferrari 296 3,85° à Monza, McLaren 720S 4,80° au Mans/Monza) ; Peugeot 9X8 2023 sans aile = pas de réglage"
    live_adjustable: false
    typical_range:
      hypercar: {value: "selon voiture (ex. 1–10 crans)", confidence: medium}
      lmp2: {value: "car-spécifique", confidence: medium}
      gt3: {value: "car-spécifique, en degrés ; < 30 % d'aile = « très rapide » sur circuits à longues lignes droites", confidence: high}
    default_step: "±1 cran (GT3 : ±0,5–1°)"
    index_step: {value: 1.0, unit: deg, confidence: low, source: "Porsche 911 GT3 R : 3 ↔ 9.3 deg, 4 ↔ 10.3 deg (LMGT3 seulement ; Hypercar en crans P1…)"}
    notes: "« Un seul cran change le caractère de la voiture » (Coach Dave). Paramètre n°1 de l'équilibre haute vitesse en GT3 (Hoekstra)."
    confidence: high
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"
      - "https://arnouthoekstra.substack.com/p/fixed-setups-are-a-blessing-in-lmu"
      - "https://traxion.gg/widespread-bop-adjustments-nerf-bmw-lmgt3-and-alpine-a424-in-new-le-mans-ultimate-update/"

  - id: aero.front_flap
    label_fr: "Volet / flap avant, dive planes"
    group: aero
    svm: {section: FRONTWING, key: FWSetting, per_wheel: false, confidence: high, index_sign: 1}
    unit: cran
    classes: [hypercar, lmp2]
    bop_locked: false
    live_adjustable: false
    typical_range:
      hypercar: {value: "car-spécifique, parfois absent", confidence: low}
      lmp2: {value: "présence à confirmer par l'API garage", confidence: low}
      gt3: {value: "splitter / dive planes généralement fixes", confidence: medium}
    default_step: "±1 cran"
    notes: "À détecter voiture par voiture (libellé « N/A » / « Non-adjustable » dans le .svm ou minValue == maxValue en REST). Si absent, les règles utilisent aero.rake."
    confidence: low
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  - id: aero.rh_front
    label_fr: "Hauteur de caisse avant"
    group: aero
    svm: {section: "FRONTLEFT / FRONTRIGHT", key: RideHeightSetting, per_wheel: true, confidence: high, index_sign: 1}
    unit: "mm (statique, sans carburant)"
    live_field: player.aero.front_ride_height_mm
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: "partial: hauteur minimale possible par BoP en LMGT3 (cité par le wiki, non publié)"
    live_adjustable: false
    typical_range:
      hypercar: {value: "≈ 40–80 mm", confidence: low}
      lmp2: {value: "≈ 30–70 mm", confidence: low}
      gt3: {value: "≈ 50–90 mm", confidence: low}
    default_step: "±2 mm (Hypercar avant : ±1 mm)"
    index_step: {value: 1.0, unit: mm, confidence: medium, source: "BMW M4 LMGT3 : 0 ↔ 5.0 cm, 3 ↔ 5.3 cm"}
    notes: "Très sensible : « quelques mm » changent l'équilibre ; trop bas = talonnage / décrochage de fond plat en zone rapide (D-PLT-01) ; trop haut = grosse perte d'appui."
    confidence: medium
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"
      - "https://lemansultimate.wiki.gg/wiki/LMP2"

  - id: aero.rh_rear
    label_fr: "Hauteur de caisse arrière"
    group: aero
    svm: {section: "REARLEFT / REARRIGHT", key: RideHeightSetting, per_wheel: true, confidence: high, index_sign: 1}
    unit: mm
    live_field: player.aero.rear_ride_height_mm
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: "partial: voir aero.rh_front"
    live_adjustable: false
    typical_range:
      hypercar: {value: "≈ 40–80 mm", confidence: low}
      lmp2: {value: "≈ 30–70 mm", confidence: low}
      gt3: {value: "≈ 50–90 mm", confidence: low}
    default_step: "±2 mm"
    index_step: {value: 1.0, unit: mm, confidence: medium, source: "BMW M4 LMGT3 : 15 ↔ 6.5 cm, 25 ↔ 7.5 cm ; Porsche 911 GT3 R : 20 ↔ 7.0 cm, 22 ↔ 7.2 cm"}
    confidence: medium
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  - id: aero.rake
    label_fr: "Rake (différence de hauteur arrière − avant)"
    group: aero
    svm: null
    unit: "mm (dérivé : rh_rear − rh_front)"
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: false
    derived_from: [aero.rh_front, aero.rh_rear]
    default_step: "±1–2 mm"
    svm_translation: {param: aero.rh_rear, note: "Le rake n'est pas une clé du fichier : Corde le règle par la hauteur arrière (rake + = arrière plus haut), l'avant ne bouge pas."}
    notes: "Pseudo-paramètre des règles : « rake + » = monter l'arrière ou baisser l'avant. Toute modification sur Hypercar réactive la vérification de talonnage (ARB-04)."
    confidence: high
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  # ===== Suspension ====================================================================================
  - id: susp.spring_front
    label_fr: "Ressorts avant"
    group: suspension
    svm: {section: "FRONTLEFT / FRONTRIGHT", key: SpringSetting, per_wheel: true, confidence: high, index_sign: 1}
    unit: "N/mm (cran)"
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: false
    typical_range:
      hypercar: {value: "car-spécifique", confidence: medium}
      gt3: {value: "car-spécifique", confidence: high}
    default_step: "±1 cran (≈ ±5–10 %)"
    notes: "Ressorts très mous sur Hypercar = « floor stall » et bascule d'équilibre imprévisible (Coach Dave). Clés voisines héritées de rF2 : TenderSpringSetting, TenderTravelSetting, SpringRubberSetting (probablement N/A)."
    confidence: medium
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  - id: susp.spring_rear
    label_fr: "Ressorts arrière"
    group: suspension
    svm: {section: "REARLEFT / REARRIGHT", key: SpringSetting, per_wheel: true, confidence: high, index_sign: 1}
    unit: "N/mm (cran)"
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: false
    default_step: "±1 cran (≈ ±5–10 %)"
    confidence: medium
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  - id: susp.third_front
    label_fr: "3e élément (heave) avant"
    group: suspension
    svm: {section: SUSPENSION, key: Front3rdSpringSetting, per_wheel: false, confidence: high, index_sign: 1}
    related_svm_keys: [Front3rdPackerSetting, Front3rdTenderSpringSetting, Front3rdTenderTravelSetting, Front3rdSlowBumpSetting, Front3rdFastBumpSetting, Front3rdSlowReboundSetting, Front3rdFastReboundSetting]
    unit: "N/mm (cran) ; packer en mm"
    live_field: player.aero.third_front_mm
    classes: [hypercar, lmp2, lmp3]
    bop_locked: false
    live_adjustable: false
    default_step: "±1 cran"
    notes: "Prototypes seulement (absent en général sur LMGT3). Présence réglable à vérifier voiture par voiture."
    confidence: medium
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  - id: susp.third_rear
    label_fr: "3e élément (heave) arrière"
    group: suspension
    svm: {section: SUSPENSION, key: Rear3rdSpringSetting, per_wheel: false, confidence: high, index_sign: 1}
    related_svm_keys: [Rear3rdPackerSetting, Rear3rdSlowBumpSetting, Rear3rdFastBumpSetting, Rear3rdSlowReboundSetting, Rear3rdFastReboundSetting]
    unit: "N/mm (cran)"
    live_field: player.aero.third_rear_mm
    classes: [hypercar, lmp2, lmp3]
    bop_locked: false
    live_adjustable: false
    default_step: "±1 cran"
    confidence: medium
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  - id: susp.packer_front
    label_fr: "Packers / butées avant"
    group: suspension
    svm: {section: "FRONTLEFT / FRONTRIGHT", key: PackerSetting, per_wheel: true, confidence: high, index_sign: 1}
    unit: mm
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: false
    typical_range:
      hypercar: {value: "0–30 mm", confidence: medium}
    default_step: "±2 mm"
    index_step: {value: 1.0, unit: mm, confidence: medium, source: "BMW M4 LMGT3 : 0 ↔ 0.0 cm, 4 ↔ 0.4 cm"}
    notes: "Empêchent le talonnage sans changer la hauteur statique (guide LMP3 officiel). « Packer distances » = facteur n°2 de pilotabilité en GT3 (Hoekstra)."
    confidence: medium
    sources:
      - "https://lemansultimate.com/?p=3955"
      - "https://arnouthoekstra.substack.com/p/fixed-setups-are-a-blessing-in-lmu"

  - id: susp.packer_rear
    label_fr: "Packers / butées arrière"
    group: suspension
    svm: {section: "REARLEFT / REARRIGHT", key: PackerSetting, per_wheel: true, confidence: high, index_sign: 1}
    unit: mm
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: false
    default_step: "±2 mm"
    index_step: {value: 1.0, unit: mm, confidence: medium, source: "BMW M4 LMGT3 / Porsche 911 GT3 R : 0 ↔ 0.0 cm, 6 ↔ 0.6 cm"}
    notes: "« Rear packers » cités par Coach Dave pour stabiliser l'arrière de la Porsche 963."
    confidence: medium
    sources:
      - "https://coachdaveacademy.com/tutorials/lmu-porsche-963-guide-the-inside-line/"

  - id: susp.arb_front
    label_fr: "Barre anti-roulis avant"
    group: suspension
    svm: {section: SUSPENSION, key: FrontAntiSwaySetting, per_wheel: false, confidence: high, index_sign: 1}
    unit: "cran (ex. P1–P7), N/mm ou mm (LMP3)"
    live_field: player.electronics.arb_front
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: "certaines Hypercars (barre réglable en roulant, champ ARB de la mémoire partagée)"
    default_step: "±1 cran"
    confidence: high
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  - id: susp.arb_rear
    label_fr: "Barre anti-roulis arrière"
    group: suspension
    svm: {section: SUSPENSION, key: RearAntiSwaySetting, per_wheel: false, confidence: high, index_sign: 1}
    unit: "cran, N/mm ou mm"
    live_field: player.electronics.arb_rear
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: "certaines Hypercars"
    default_step: "±1 cran"
    notes: "Barre AR raide = arrière imprévisible sur vibreurs (Coach Dave)."
    confidence: high
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  - id: susp.sbump_front
    label_fr: "Amortisseur avant : compression lente (slow bump)"
    group: dampers
    svm: {section: "FRONTLEFT / FRONTRIGHT", key: SlowBumpSetting, per_wheel: true, confidence: high, index_sign: 1}
    unit: clics
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: false
    typical_range:
      hypercar: {value: "1–20 ou 1–30 selon voiture", confidence: medium}
    default_step: "±2 clics"
    notes: "Seuil lent/rapide défini par voiture (≈ 25–50 mm/s, confiance low) ; valider par histogramme D-DMP-01."
    confidence: medium
    sources:
      - "https://www.hpacademy.com/courses/professional-motorsport-data-analysis/damper-analysis-damping-histogram/"

