  # ===== Géométrie =====================================================================================
  - id: geo.camber_front
    label_fr: "Carrossage avant"
    group: geometry
    svm: {section: "FRONTLEFT / FRONTRIGHT", key: CamberSetting, per_wheel: true, confidence: high, index_sign: -1}
    unit: "° (négatif)"
    live_field: player.wheels[0..1].camber_deg
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: false
    typical_range:
      hypercar: {value: "−2,0 à −3,5°", confidence: low}
      lmp2: {value: "−2,0 à −3,5°", confidence: low}
      gt3: {value: "−2,5 à −4,0°", confidence: low}
    default_step: "±0,2°"
    index_step: {value: 0.0667, unit: deg, confidence: low, source: "BMW M4 LMGT3 : 22 ↔ −2.20 deg, 40 ↔ −1.00 deg (varie d'une voiture à l'autre)"}
    notes: "Impact faible sur le chrono en LMU selon certains setupeurs ; régler d'après les températures intérieur/milieu/extérieur (D-TYR-01). Dans les règles, « + » = plus négatif."
    confidence: low
    sources:
      - "https://arnouthoekstra.substack.com/p/fixed-setups-are-a-blessing-in-lmu"
      - "https://www.overtake.gg/threads/optimal-camber-my-thought-process-on-tyre-workloads.195866/"

  - id: geo.camber_rear
    label_fr: "Carrossage arrière"
    group: geometry
