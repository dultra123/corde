    unit: "nombre + réglages par arrêt"
    live_field: player.energy.scheduled_stops
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: true
    notes: "Hors périmètre des règles d'équilibre ; utile au widget stratégie (REST pitstop-estimate)."
    confidence: high
    sources:
      - "docs/research/01-telemetrie-lmu.md §3"

  # ===== Direction, refroidissement ======================================================================
  - id: steer.lock
    label_fr: "Butée / rapport de direction"
    group: steering
    svm: {section: CONTROLS, key: SteerLockSetting, per_wheel: false, confidence: high, index_sign: -1}
    rest_key: VM_STEER_LOCK
    unit: "° (ou cran)"
    live_field: player.inputs.wheel_range_deg
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: false
    default_step: "±1 cran"
    notes: "Non physique mais utile sur circuits lents (voiture plus vive)."
    confidence: medium
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"

  - id: cooling.radiators
    label_fr: "Caches radiateur eau / huile"
    group: cooling
    svm: {section: BODYAERO, key: "WaterRadiatorSetting / OilRadiatorSetting", per_wheel: false, confidence: high, index_sign: 0}
    unit: cran
    live_field: player.engine.water_c
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: false
    live_adjustable: false
    notes: "Garder eau / huile < 120 °C (guide LMP3). Hors règles d'équilibre."
    confidence: medium
    sources:
      - "https://lemansultimate.com/?p=3955"

  # ===== Héritage rF2, probablement non réglables en LMU (à confirmer via minValue == maxValue) =========
  - id: legacy.chassis
    label_fr: "Réglages hérités de rFactor 2 (probablement figés)"
    group: legacy
    svm: {section: "GENERAL / SUSPENSION / LEFTFENDER / RIGHTFENDER / FRONTLEFT…", key: "CGHeightSetting, CGRightSetting, CGRearSetting, WedgeSetting, FrontWheelTrackSetting, RearWheelTrackSetting, LeftTrackBarSetting, RightTrackBarSetting, ChassisAdj00..11Setting, FenderFlareSetting, TenderSpringSetting, TenderTravelSetting, SpringRubberSetting, BrakeDiscSetting, BrakePadSetting, HandfrontbrakePressSetting, HandbrakePressSetting", per_wheel: false, confidence: high, index_sign: 0}
    classes: [hypercar, lmp2, lmp3, gt3]
    bop_locked: true
    live_adjustable: false
    notes: "Présents dans les fichiers .svm ; les libellés « N/A » / « Non-adjustable » indiquent ce qui est figé pour une voiture donnée. Lest et répartition de masse sont fixés par le BoP (WeightPenalty)."
    confidence: medium
    sources:
      - "docs/research/01-telemetrie-lmu.md §3"

# ---------------------------------------------------------------------------------------------------
# Leviers verrouillés par le BoP (A.5) — à ne jamais proposer en modification ; servent d'invariants.
# ---------------------------------------------------------------------------------------------------
bop_levers:
  - {lever: WeightPenalty, label_fr: "Lest (position fixée)", classes: [hypercar, lmp2, lmp3, gt3], unit: kg, example: "Lamborghini Huracán +45 kg Le Mans ; Porsche 963 +10 kg partout", confidence: high}
  - {lever: MaxPowerOutput, label_fr: "Puissance maximale", classes: [hypercar], unit: kW, example: "BMW / Cadillac / Lamborghini −5 kW Le Mans", confidence: high}
  - {lever: PowerOutput, label_fr: "Puissance (%)", classes: [gt3], unit: "%", example: "Ford −2 % Monza", confidence: high}
  - {lever: MaxStintEnergy, label_fr: "Énergie maximale par relais", classes: [gt3, lmp2, hypercar], unit: MJ, example: "Porsche 911 +22 MJ Bahreïn", confidence: high}
  - {lever: MinimumAllowedRearWing, label_fr: "Angle d'aileron arrière minimal", classes: [gt3], unit: "°", example: "3,85° (296 GT3, Monza) ; 4,80° (720S, Le Mans / Monza)", confidence: high}
  - {lever: AeroDrag, label_fr: "Traînée aérodynamique", classes: [gt3], unit: "—", example: "Corvette à Monza", confidence: high}
  - {lever: CombinedPower, label_fr: "Puissance totale combinée", classes: [hypercar], unit: kW, example: "500 kW pour tous", confidence: high}
  - {lever: FrontMguDeploymentSpeed, label_fr: "Vitesse de déploiement du MGU avant", classes: [hypercar], unit: km/h, example: "190 (Ferrari / Toyota), 150 (Peugeot) ; LMDh : dès 0 km/h", confidence: high}
  - {lever: MguPower, label_fr: "Puissance MGU / régénération", classes: [hypercar], unit: kW, example: "LMH 200 kW / LMDh 50 kW ; régén 200 / 170 kW", confidence: high}
  - {lever: MinimumRideHeight, label_fr: "Hauteur de caisse minimale", classes: [gt3], unit: mm, example: "non publié", confidence: low}
  - {lever: GearRatioSets, label_fr: "Jeux de rapports", classes: [hypercar, lmp2, lmp3, gt3], unit: "—", example: "« Le Mans » vs « Standard »", confidence: high}
  - {lever: ClassMass, label_fr: "Masse LMP2", classes: [lmp2], unit: kg, example: "930–950 kg (+7 kg en v1.4)", confidence: high}

# Aides « pilote » (réglages du jeu, pas du setup) et leur pénalité de masse en Hypercar.
driver_aids:
  - {aid: ABS, classes: [hypercar], levels: "Low / High", weight_penalty_kg: "+25 / +45", confidence: high, source: "https://traxion.gg/le-mans-ultimate-update-adjusts-lmgt3-bop-and-increases-driver-aid-weight-penalties/"}
  - {aid: StabilityControl, classes: [hypercar], levels: "Low / High", weight_penalty_kg: "+20 / +40", confidence: high, source: "https://traxion.gg/le-mans-ultimate-update-adjusts-lmgt3-bop-and-increases-driver-aid-weight-penalties/"}

# Fenêtres thermiques connues (A.4) — ordres de grandeur ; la valeur officielle par composé se lit
# dans player.wheels[i].optimal_temp_c (mémoire partagée) ou via REST, jamais codée en dur.
thermal_windows:
  tyres:
    - {scope: "GT3 / Hypercar slicks", target: "≈ 78–80 °C de carcasse en régime (communauté) ; iRacing GT3 transposable 80–90 °C", confidence: low}
    - {scope: "Pneus pluie", target: "≈ 60–80 °C", confidence: low}
    - {scope: "LMP3 (guide officiel)", target: "85–95 °C via les conduits de frein", confidence: medium}
    - {scope: "Surchauffe", target: "surface > ~110–115 °C prolongée", confidence: low}
  brakes:
    - {scope: "LMGT3 (acier)", target: "optimum ≈ 350–650 °C avant ; froid < 250 ; chaud > 750", confidence: low}
    - {scope: "Prototypes / Hypercar (carbone)", target: "optimum ≈ 400–800 °C ; froid < 300 ; fade > 1000", confidence: low}
  notes:
    - "v1.2.3 : pics de température réduits, chauffe plus longue ; v1.4 : grip à froid Hypercar amélioré, courbes friction/température des plaquettes réalistes."
    - "Loi des gaz : p_chaud ≈ p_froid × (T_chaud + 273,15) / (T_froid + 273,15) (pressions absolues), soit ≈ +0,5–0,6 kPa par °C de gaz pour 180 kPa manométrique."
  sources:
    - "https://steamcommunity.com/app/2399420/discussions/0/777534074828971181"
    - "https://traxion.gg/le-mans-ultimates-hypercars-given-massive-tyre-update/"
    - "https://lemansultimate.com/?p=3955"

