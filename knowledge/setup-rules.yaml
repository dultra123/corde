# knowledge/setup-rules.yaml — règles « symptôme → modification de setup » pour Le Mans Ultimate.
#
# GÉNÉRÉ depuis docs/research/02-ingenieur-de-course.md (blocs YAML C.1–C.8, dictionnaire C.0,
# matrice C.9) puis nettoyé : identifiants normalisés, directions en énumération, confiances en toutes
# lettres, références aux diagnostics de knowledge/diagnostics.yaml. Le schéma est décrit dans
# knowledge/README.md. Ne pas modifier à la main sans mettre à jour le brief ou le README.
#
# Conventions : classes = valeurs de `VehicleClass` du protocole (hypercar, lmp2, gt3) ;
# philosophy `safe` = le réglage « soft / sûr » du client, `aggressive` = « agressif », `both` = neutre.
# Les magnitudes sont des pas relatifs (jamais des valeurs absolues) : la plage réelle d'un paramètre
# se lit à l'exécution (REST getPlayerGarageData / .svm). Niveau de confiance : high / medium / low,
# tel que porté par le brief (C=H/M/L). Aucun chiffre n'a été ajouté par rapport au brief.

schema_version: 1
source: "docs/research/02-ingenieur-de-course.md"
generated_from_sections: [C.0, C.1, C.2, C.3, C.4, C.5, C.6, C.7, C.8, C.9]

# Énumérations utilisées par les règles.
enums:
  phase: [entry, mid, exit, braking, straight, any]
  corner_speed: [slow, medium, fast, any]
  surface: [dry, wet, any]
  philosophy: [both, aggressive, safe]
  direction:
    increase: "augmenter le paramètre dans le sens défini par params[].sign (voir ci-dessous)"
    decrease: "diminuer"
    either: "le sens dépend du diagnostic (voir magnitude / side_effects)"
    toward_zero: "réduire la valeur absolue (ex. moins de pince, qu'elle soit positive ou négative)"
    set: "fixer une valeur discrète donnée par `value` (max, harder, softer, wet, slick)"
    check: "pas de modification : vérifier la condition décrite dans magnitude avant tout changement"
    meta: "appliquer un autre groupe de règles (param meta.balance, value = reduce_understeer | reduce_oversteer | neutralise_balance)"
  confidence: [high, medium, low]

# Dictionnaire des paramètres canoniques (C.0). La correspondance avec les clés .svm / REST et les
# plages par classe est dans knowledge/setup-parameters.yaml (même identifiant `id`).
params:
  - {id: aero.rear_wing, unit: "cran ou °", sign: "+ = plus d'appui arrière"}
  - {id: aero.front_flap, unit: cran, sign: "+ = plus d'appui avant ; si absent sur la voiture, utiliser aero.rake"}
  - {id: aero.rh_front, unit: mm, sign: "+ = plus haut"}
  - {id: aero.rh_rear, unit: mm, sign: "+ = plus haut"}
  - {id: aero.rake, unit: "mm (dérivé = rh_rear − rh_front)", sign: "+ = plus de rake (arrière plus haut ou avant plus bas)"}
  - {id: susp.spring_front, unit: cran, sign: "+ = plus raide"}
  - {id: susp.spring_rear, unit: cran, sign: "+ = plus raide"}
  - {id: susp.third_front, unit: cran, sign: "3e élément (heave), prototypes ; + = plus raide"}
  - {id: susp.third_rear, unit: cran, sign: "3e élément (heave), prototypes ; + = plus raide"}
  - {id: susp.packer_front, unit: mm, sign: "+ = butée plus longue = course restante plus courte"}
  - {id: susp.packer_rear, unit: mm, sign: "+ = butée plus longue = course restante plus courte"}
  - {id: susp.arb_front, unit: cran, sign: "+ = plus raide"}
  - {id: susp.arb_rear, unit: cran, sign: "+ = plus raide"}
  - {id: susp.sbump_front, unit: clics, sign: "bump lent ; + = plus ferme"}
  - {id: susp.sbump_rear, unit: clics, sign: "bump lent ; + = plus ferme"}
  - {id: susp.srebound_front, unit: clics, sign: "rebound lent ; + = plus ferme"}
  - {id: susp.srebound_rear, unit: clics, sign: "rebound lent ; + = plus ferme"}
  - {id: susp.fbump_front, unit: clics, sign: "bump rapide ; + = plus ferme"}
  - {id: susp.fbump_rear, unit: clics, sign: "bump rapide ; + = plus ferme"}
  - {id: susp.frebound_front, unit: clics, sign: "rebound rapide ; + = plus ferme"}
  - {id: susp.frebound_rear, unit: clics, sign: "rebound rapide ; + = plus ferme"}
  - {id: geo.camber_front, unit: "°", sign: "+ = plus négatif (« plus de carrossage »)"}
  - {id: geo.camber_rear, unit: "°", sign: "+ = plus négatif (« plus de carrossage »)"}
  - {id: geo.toe_front, unit: "°", sign: "+ = plus de pince (toe-in) ; − = ouverture"}
  - {id: geo.toe_rear, unit: "°", sign: "+ = plus de pince (toe-in) ; − = ouverture"}
  - {id: geo.caster, unit: "°", sign: "+ = plus de chasse"}
  - {id: tyre.pressure_front, unit: kPa, sign: "+ = plus de pression (par roue possible)"}
  - {id: tyre.pressure_rear, unit: kPa, sign: "+ = plus de pression (par roue possible)"}
  - {id: tyre.compound, unit: "soft|medium|hard|wet", sign: "valeur discrète (set)"}
  - {id: brake.bias_front, unit: "% avant", sign: "+ = plus avant"}
  - {id: brake.migration, unit: "0–2,5 (pas 0,5)", sign: "Hypercar ; + = plus de migration vers l'avant à pleine pédale"}
  - {id: brake.pressure, unit: "% force pédale max", sign: "+ = plus de pression"}
  - {id: brake.duct_front, unit: cran, sign: "+ = plus ouvert = freins plus froids"}
  - {id: brake.duct_rear, unit: cran, sign: "+ = plus ouvert = freins plus froids"}
  - {id: brake.abs_map, unit: map, sign: "LMGT3 ; + = plus intrusif"}
  - {id: diff.preload, unit: Nm, sign: "+ = plus de précharge"}
  - {id: diff.power, unit: "% ou cran", sign: "+ = plus fermé en charge"}
  - {id: diff.coast, unit: "% ou cran", sign: "+ = plus fermé en retenue"}
  - {id: elec.tc, unit: "1–11", sign: "+ = plus d'intervention"}
  - {id: elec.tc_cut, unit: "1–11", sign: "+ = plus de coupure quand le TC intervient"}
  - {id: elec.tc_slip, unit: "1–11", sign: "+ = plus de glissement toléré avant intervention (valeur basse = intervention plus tôt, dans les deux lectures du guide officiel et de la communauté)"}
  - {id: elec.motor_map, unit: kW, sign: "Hypercar ; + = plus de déploiement"}
  - {id: elec.regen, unit: niveau, sign: "Hypercar ; + = plus de régénération"}
  - {id: elec.engine_map, unit: "map / mixture", sign: "+ = plus riche / plus de performance"}
  - {id: energy.fuel_ratio, unit: "sans unité (≈ 0,90–1,00)", sign: "+ = plus de carburant réel par unité d'énergie virtuelle"}
  - {id: energy.virtual_energy, unit: "% du max relais", sign: "+ = plus d'énergie chargée"}
  - {id: fuel.load, unit: L, sign: "+ = plus de carburant"}
  - {id: steer.lock, unit: "° ou cran", sign: "+ = direction plus directe"}
  - {id: meta.balance, unit: "—", sign: "pseudo-paramètre : appliquer les règles d'équilibre indiquées dans `value` (reduce_understeer / reduce_oversteer / neutralise_balance)"}

# Magnitude par défaut d'un « cran d'ingénieur » quand une règle dit « 1 pas » (C.0, confiance medium).
default_steps:
  "susp.arb_*": "±1 cran"
  "susp.spring_*": "±1 cran (≈ ±5–10 %)"
  "susp.*bump_* / susp.*rebound_*": "±2 clics"
  "aero.rh_*": "±2 mm (Hypercar avant : ±1 mm)"
  "aero.rear_wing": "±1 cran (GT3 : ±0,5–1°)"
  "tyre.pressure_*": "±3 kPa (≈ ±0,4 psi)"
  "geo.camber_*": "±0,2°"
  "geo.toe_*": "±0,05°"
  "brake.bias_front": "±0,5–1 %"
  "brake.migration": "±0,5"
  "diff.preload": "±15 Nm"
  "diff.power / diff.coast": "±1 cran (≈ ±5–10 %)"
  "elec.tc / elec.tc_cut / elec.tc_slip": "±1"
  "elec.motor_map": "±10 kW (LMH) / ±5 kW (LMDh)"
  "susp.packer_*": "±2 mm"

# Règles d'arbitrage entre règles concurrentes (C.9).
arbitration:
  - id: ARB-01
    rule: "Ne jamais appliquer deux changements de signe opposé sur le même paramètre dans une même itération."
  - id: ARB-02
    rule: "Si deux symptômes appellent des changements contradictoires sur un paramètre, privilégier le symptôme de sécurité (freinage, stabilité) en philosophie safe et le symptôme de performance en philosophie aggressive ; chercher un autre levier pour le second symptôme."
  - id: ARB-03
    rule: "Limiter une itération à 3 paramètres modifiés (1 seul en phase de validation)."
  - id: ARB-04
    rule: "Toute modification de hauteur de caisse ou d'aileron sur Hypercar réactive automatiquement la vérification de talonnage (D-PLT-01)."
  - id: ARB-05
    rule: "Priorité des symptômes : sécurité (blocages, instabilité au freinage, snaps rapides) > pilotabilité (prévisibilité, fatigue) > performance (rotation, Vmax) > usure/consommation ; en philosophie safe, usure/consommation remonte en 2e position."

# Matrice d'effets croisés (C.9) : effet principal attendu et effets secondaires à surveiller.
cross_effects:
  - {param: aero.rear_wing, direction: increase, main_effect: "stabilité rapide, grip arrière", watch: "Vmax −, sous-virage rapide, consommation +"}
  - {param: aero.rake, direction: increase, main_effect: "appui avant, rotation rapide", watch: "talonnage avant, décrochage de fond plat (Hypercar), instabilité arrière rapide"}
  - {param: "aero.rh_*", direction: decrease, main_effect: "appui +", watch: "talonnage, packers sollicités, bascule d'équilibre"}
  - {param: susp.arb_front, direction: increase, main_effect: "réponse, moins de roulis", watch: "sous-virage, roue avant intérieure délestée (blocage)"}
  - {param: susp.arb_rear, direction: increase, main_effect: rotation, watch: "patinage intérieur, vibreurs, usure arrière"}
  - {param: "susp.spring_*", direction: increase, main_effect: "plateforme, assiette", watch: "grip sur bosses −, vibreurs −"}
  - {param: "susp.packer_*", direction: increase, main_effect: anti-talonnage, watch: "raideur soudaine en appui"}
  - {param: "susp.third_*", direction: increase, main_effect: "assiette aéro", watch: "compliance en heave −"}
  - {param: "susp.sbump_*", direction: either, main_effect: "transitoire (charge immédiate sur l'extrémité qui se comprime)", watch: "nervosité / flottement"}
  - {param: "susp.srebound_*", direction: either, main_effect: "transitoire (délestage de l'extrémité qui se détend)", watch: "roue intérieure soulevée, « jacking down »"}
  - {param: "susp.fbump_* / susp.frebound_*", direction: decrease, main_effect: "vibreurs, bosses", watch: "mouvement de caisse sur gros chocs"}
  - {param: "geo.camber_*", direction: increase, main_effect: "grip latéral", watch: "intérieur chaud, freinage/motricité en ligne −"}
  - {param: geo.toe_front, direction: decrease, main_effect: turn-in, watch: "stabilité en ligne −, chauffe"}
  - {param: geo.toe_rear, direction: increase, main_effect: "stabilité entrée/sortie", watch: "chauffe/usure arrière, traînée"}
  - {param: "tyre.pressure_*", direction: decrease, main_effect: "grip mécanique, compliance", watch: "chauffe carcasse +, réponse −, minimum imposé par le jeu"}
  - {param: brake.bias_front, direction: increase, main_effect: "stabilité au freinage", watch: "sous-virage d'entrée, blocage avant"}
  - {param: brake.migration, direction: increase, main_effect: "freinage max en appui, rotation en trail braking", watch: "blocages avant à pleine pédale, chauffe des freins"}
  - {param: diff.power, direction: increase, main_effect: "motricité, stabilité en sortie", watch: "pousse-avant sous gaz"}
  - {param: diff.coast, direction: increase, main_effect: "stabilité en entrée", watch: "sous-virage d'entrée"}
  - {param: diff.preload, direction: increase, main_effect: "stabilité des transitions", watch: "voiture moins libre"}
  - {param: elec.tc, direction: increase, main_effect: "sécurité, usure arrière −", watch: "performance en sortie −"}
  - {param: elec.motor_map, direction: increase, main_effect: "performance, vide la batterie", watch: "LMH : sous-virage sous gaz > 150/190 km/h ; batterie vide"}
  - {param: "brake.duct_*", direction: increase, main_effect: "freins plus froids", watch: "pneus/jantes plus froids, légère traînée"}

# Lacunes connues (références non résolues, à compléter lors de la validation en jeu).
known_gaps:
  - {kind: dangling_conflict, id: PLT-ROLL-01, note: "référencé comme conflit mais aucune règle de cet identifiant n'existe (roulis excessif : voir diagnostic D-PLT-04)"}
  - {kind: missing_rule, symptom: ENERGY_SHORT, note: "symptôme présent dans le dictionnaire de ressenti (FEEL_FUEL_HIGH) sans règle de setup ; relève de la stratégie (D-CON-02), pas du setup"}

# 46 règles, 270 couples symptôme → paramètre.
rules:
  - id: US-ENTRY-SLOW-01
    symptom: US_ENTRY_SLOW
    family: understeer
    phase: entry
    corner_speed: slow
    surface: dry
    classes: [hypercar, lmp2, gt3]
    philosophy: both
    trigger:
      telemetry: "balance[entry][slow] > +0.3 ET brake > 0.05 pendant la dérive"
      diagnostics: [D-BAL-01]
      feel: [FEEL_FRONT_WONT_TURN_IN, FEEL_PUSH_ON_BRAKES]
    changes:
      - {prio: 1, param: brake.bias_front, direction: decrease, magnitude: "0.5–1 %", confidence: high, side_effects: "risque de blocage AR en fin de freinage, instabilité en ligne droite", conflicts: [BRK-LOCK-REAR-01]}
      - {prio: 2, param: diff.coast, direction: decrease, magnitude: "1 cran", confidence: medium, side_effects: "plus de rotation au lâcher de frein, peut devenir survireur en entrée rapide", conflicts: [OS-ENTRY-FAST-01]}
      - {prio: 3, param: susp.arb_front, direction: decrease, magnitude: "1 cran", confidence: high, side_effects: "plus de roulis AV, réponse un peu plus lente, pneu AV ext. plus chargé", conflicts: [STR-LAZY-01]}
      - {prio: 4, param: susp.sbump_front, direction: increase, magnitude: "2 clics", confidence: medium, side_effects: "transitoire : plus de charge AV à la plongée, voiture plus sèche sur bosses à l'entrée", conflicts: [PLT-BUMPY-01]}
      - {prio: 5, param: susp.srebound_rear, direction: increase, magnitude: "2 clics", confidence: medium, side_effects: "délestage AR transitoire = rotation ; trop = AR léger au freinage", conflicts: [OS-ENTRY-SLOW-01]}
      - {prio: 6, param: geo.toe_front, direction: decrease, magnitude: "0.05° (vers ouverture)", confidence: medium, side_effects: "usure/chauffe AV, moins stable en ligne droite", conflicts: []}
      - {prio: 7, param: tyre.pressure_front, direction: decrease, magnitude: "3 kPa (si > mini)", confidence: medium, side_effects: "plus de chauffe carcasse AV, réponse moins vive", conflicts: [TYR-HOT-FRONT-01]}
      - {prio: 8, param: geo.camber_front, direction: increase, magnitude: "0.2° (si ΔIO < 12 °C)", confidence: medium, side_effects: "intérieur AV plus chaud, freinage droit un peu moins bon", conflicts: [TYR-HOT-INNER-01]}
      - {prio: 9, param: brake.migration, direction: decrease, magnitude: "0.5 (HY)", confidence: medium, side_effects: "moins de charge AV à pleine pédale → moins de freinage pur, mais plus de rotation en trail", conflicts: []}
    justification: "En virage lent sous freinage, l'avant sature parce que la répartition et le transfert de charge lui demandent trop ; on redonne de la rotation par le frein, le coast du différentiel et la raideur en roulis AV avant de toucher à la géométrie."
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"
      - "https://lemansultimate.com/?p=3955"
      - "https://www.sau.com.au/forums/topic/302303-car-set-up-cause-and-effect-by-carroll-smith"
    brief_section: "C.1"

  - id: US-ENTRY-FAST-01
    symptom: US_ENTRY_FAST
    family: understeer
    phase: entry
    corner_speed: fast
    surface: dry
    classes: [hypercar, lmp2, gt3]
    philosophy: both
    trigger:
      telemetry: "balance[entry][fast] > +0.3"
      diagnostics: [D-BAL-01]
      feel: [FEEL_FRONT_WONT_TURN_IN, FEEL_FRONT_LIGHT_HIGH_SPEED]
    changes:
      - {prio: 1, param: aero.rake, direction: increase, magnitude: "+1–2 mm AR ou −1 mm AV", confidence: high, side_effects: "plus d'appui AV ; HY : risque de décrochage de fond plat/talonnage si AV trop bas", conflicts: [PLT-BOTTOM-01, PLT-STALL-01]}
      - {prio: 2, param: aero.front_flap, direction: increase, magnitude: "1 cran (si dispo)", confidence: high, side_effects: "un peu de traînée, AR relativement moins stable", conflicts: [OS-EXIT-FAST-01]}
      - {prio: 3, param: aero.rear_wing, direction: decrease, magnitude: "1 cran", confidence: high, side_effects: "moins de stabilité AR en appui et au freinage, gain de Vmax", conflicts: [OS-MID-FAST-01, OS-ENTRY-FAST-01]}
      - {prio: 4, param: brake.bias_front, direction: decrease, magnitude: "0.5 %", confidence: medium, side_effects: "blocages AR possibles en freinage appuyé", conflicts: [BRK-LOCK-REAR-01]}
      - {prio: 5, param: susp.arb_front, direction: decrease, magnitude: "1 cran", confidence: medium, side_effects: "plus de roulis = plateforme aéro moins stable (HY)", conflicts: [PLT-ROLL-01]}
      - {prio: 6, param: susp.third_front, direction: decrease, magnitude: "1 cran (prototypes)", confidence: medium, side_effects: "AV plus bas en appui → plus d'appui AV mais talonnage possible", conflicts: [PLT-BOTTOM-01]}
      - {prio: 7, param: susp.sbump_front, direction: increase, magnitude: "2 clics", confidence: low, side_effects: "transitoire seulement", conflicts: []}
    justification: "En entrée rapide l'équilibre est aéro : d'abord le rake et les éléments d'appui, ensuite les transferts de charge."
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"
      - "https://arnouthoekstra.substack.com/p/fixed-setups-are-a-blessing-in-lmu"
    brief_section: "C.1"

  - id: US-MID-SLOW-01
    symptom: US_MID_SLOW
    family: understeer
    phase: mid
    corner_speed: slow
    surface: dry
    classes: [hypercar, lmp2, gt3]
    philosophy: both
    trigger:
      telemetry: "balance[mid][slow] > +0.3 ; ΔG = G_F − G_R > 0.15 ; T_front − T_rear > 6 °C"
      diagnostics: [D-BAL-01, D-TYR-05]
      feel: [FEEL_FRONT_WONT_TURN, FEEL_PUSH_MID]
    changes:
      - {prio: 1, param: susp.arb_front, direction: decrease, magnitude: "1 cran", confidence: high, side_effects: "réponse moins immédiate, plus de roulis", conflicts: [STR-LAZY-01]}
      - {prio: 2, param: susp.arb_rear, direction: increase, magnitude: "1 cran", confidence: high, side_effects: "AR plus délesté à l'intérieur → patinage intérieur en sortie, moins tolérant sur vibreurs", conflicts: [TRC-INNER-01, PLT-KERB-01]}
      - {prio: 3, param: susp.spring_front, direction: decrease, magnitude: "1 cran", confidence: medium, side_effects: "plus de plongée au freinage, hauteur AV dynamique plus basse (HY : revérifier talonnage)", conflicts: [PLT-BOTTOM-01]}
      - {prio: 4, param: tyre.pressure_front, direction: decrease, magnitude: "3 kPa", confidence: medium, side_effects: "chauffe AV", conflicts: [TYR-HOT-FRONT-01]}
      - {prio: 5, param: geo.camber_front, direction: increase, magnitude: "0.2°", confidence: medium, side_effects: "intérieur chaud, usure", conflicts: [TYR-HOT-INNER-01]}
      - {prio: 6, param: diff.preload, direction: decrease, magnitude: "15 Nm", confidence: medium, side_effects: "voiture plus libre en transition, moins stable en sortie", conflicts: [OS-EXIT-SLOW-01]}
      - {prio: 7, param: diff.power, direction: decrease, magnitude: "1 cran", confidence: medium, side_effects: "patinage intérieur en sortie", conflicts: [TRC-INNER-01]}
      - {prio: 8, param: geo.caster, direction: increase, magnitude: "0.5°", confidence: low, side_effects: "volant plus lourd, plus de gain de carrossage en braquage", conflicts: []}
      - {prio: 9, param: steer.lock, direction: increase, magnitude: "1 cran", confidence: low, side_effects: "direction plus vive (non physique, mais utile sur circuits lents)", conflicts: []}
    justification: "Virage lent = grip mécanique : répartition de raideur en roulis (barres) d'abord, ressorts ensuite, puis pneus/géométrie ; le différentiel compte car un diff serré pousse l'avant."
    sources:
      - "https://lemansultimate.wiki.gg/wiki/Setup_Guide"
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"
      - "Carroll Smith, Tune to Win"
    brief_section: "C.1"

  - id: US-MID-FAST-01
    symptom: US_MID_FAST
    family: understeer
    phase: mid
    corner_speed: fast
    surface: dry
    classes: [hypercar, lmp2, gt3]
    philosophy: both
    trigger:
      telemetry: "balance[mid][fast] > +0.3 ; mFrontDownforce/mRearDownforce bas vs référence"
      diagnostics: [D-BAL-01, D-PLT-01]
      feel: [FEEL_FRONT_WONT_TURN, FEEL_FRONT_LIGHT_HIGH_SPEED]
    changes:
      - {prio: 1, param: aero.rear_wing, direction: decrease, magnitude: "1 cran", confidence: high, side_effects: "moins de stabilité AR rapide, moins de traînée (Vmax +)", conflicts: [OS-MID-FAST-01]}
      - {prio: 2, param: aero.rake, direction: increase, magnitude: "+2 mm AR", confidence: high, side_effects: "HY : sensibilité ; LMP2 : idem", conflicts: [PLT-BOTTOM-01]}
      - {prio: 3, param: aero.front_flap, direction: increase, magnitude: "1 cran", confidence: high, side_effects: "traînée", conflicts: []}
      - {prio: 4, param: susp.arb_front, direction: decrease, magnitude: "1 cran", confidence: medium, side_effects: "roulis, plateforme", conflicts: []}
      - {prio: 5, param: susp.third_rear, direction: increase, magnitude: "1 cran (prototypes)", confidence: medium, side_effects: "AR tenu plus haut en appui → rake dynamique +, mais moins de compliance AR", conflicts: [PLT-BUMPY-01]}
      - {prio: 6, param: susp.spring_rear, direction: increase, magnitude: "1 cran (GT3)", confidence: medium, side_effects: "moins de motricité sur bosses", conflicts: [TRC-BOTH-01]}
    justification: "À haute vitesse, l'équilibre est dicté par la répartition d'appui et l'assiette dynamique."
    sources:
      - "https://coachdaveacademy.com/tutorials/the-ultimate-le-mans-ultimate-setup-guide/"
    brief_section: "C.1"

  - id: US-EXIT-SLOW-01
    symptom: US_EXIT_SLOW
    family: understeer
    phase: exit
    corner_speed: slow
    surface: dry
    classes: [hypercar, lmp2, gt3]
    philosophy: both
    trigger:
      telemetry: "balance[exit][slow] > +0.3 avec throttle > 0.5 ; κ_R faible"
      diagnostics: [D-BAL-01, D-TRC-01]
      feel: [FEEL_PUSH_ON_THROTTLE]
    changes:
      - {prio: 1, param: diff.power, direction: decrease, magnitude: "1 cran", confidence: high, side_effects: "patinage intérieur, moins de stabilité à la remise des gaz", conflicts: [TRC-INNER-01]}
