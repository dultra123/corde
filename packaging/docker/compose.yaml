# Corde serveur dans un conteneur : le « Projet » de Container Manager (Synology), ou
# « docker compose up -d » ailleurs. Guide pas à pas : docs/SYNOLOGY.md.
#
# Rien à télécharger ni à importer : l'image est prise dans le registre de GitHub (ghcr.io) à la
# création du projet. Pour mettre à jour : arrêter le projet, puis le créer à nouveau
# (Synology : Projet → Action → Arrêt, puis Action → Créer ; ailleurs : docker compose up -d).
#
# « version: "2.4" » : ignoré par Docker Compose v2 (simple avertissement). Avec l'ancien
# docker-compose 1.x, retire la ligne « pull_policy » et lance « docker-compose pull » avant
# « up -d ».
version: "2.4"

services:
  corde:
    # « latest » : la dernière version publiée. Pour rester sur une version précise, remplace
    # « latest » par son numéro (ex. 1.12.0) et retire la ligne « pull_policy ».
    # Sans accès à Internet sur le NAS : importe le fichier corde-server-<version>-docker-x64.tar.gz
    # de la release, mets ici « corde-server:<version> » et retire « pull_policy ».
    image: ghcr.io/dultra123/corde-server:latest
    # À chaque création du projet, vérifie s'il existe une image plus récente et la prend.
    # (Un redémarrage du NAS ou du conteneur ne télécharge rien.)
    pull_policy: always
    container_name: corde
    restart: unless-stopped
    ports:
      # Côté gauche : le port du NAS (à changer s'il est déjà pris, ex. "8472:8471").
      # Ne JAMAIS rediriger ce port depuis ta box : l'accès extérieur passe par un VPN.
      - "8471:8471"
    volumes:
      # Les données (sessions, appareils appairés, courses) : le dossier « data » à côté de ce
      # fichier. Une mise à jour de l'image n'y touche pas.
      - ./data:/var/lib/corde
    environment:
      # 1 : tant qu'aucun appareil n'est appairé, un code d'appairage s'affiche dans le journal du
      # conteneur à chaque démarrage. 0 : jamais.
      CORDE_FIRST_PAIRING_CODE: "1"
      # Autres noms sous lesquels tu ouvres le serveur, séparés par des virgules (ex. un nom donné
      # par ton VPN). Les adresses IP sont toujours acceptées.
      CORDE_ALLOW_HOST: ""
    # Durcissement : système de fichiers en lecture seule (seules les données s'écrivent),
    # aucune capacité sauf celles qu'il faut au démarrage pour donner le dossier de données au
    # compte « corde » puis quitter root (CHOWN, DAC_READ_SEARCH, SETUID, SETGID), aucun gain
    # de privilège ensuite.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    # Un NAS de 2 Go : Corde serveur en utilise bien moins, la limite protège le reste du NAS.
    mem_limit: 512m
    pids_limit: 256
